<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quickbase Reporting Studio</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap");

    :root {
      --bg: #eef2ea;
      --bg-accent: #f7f4eb;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-strong: #ffffff;
      --panel-soft: #f6f7f1;
      --text: #173126;
      --text-soft: #506257;
      --text-faint: #718276;
      --line: rgba(27, 52, 40, 0.12);
      --line-strong: rgba(27, 52, 40, 0.2);
      --brand: #0d7c66;
      --brand-soft: rgba(13, 124, 102, 0.12);
      --brand-deep: #095e4e;
      --accent: #d88d3d;
      --danger: #b4513e;
      --danger-soft: rgba(180, 81, 62, 0.12);
      --warn: #9a6a14;
      --warn-soft: rgba(154, 106, 20, 0.13);
      --ok: #2a7a4a;
      --ok-soft: rgba(42, 122, 74, 0.12);
      --shadow: 0 18px 60px rgba(22, 39, 31, 0.08);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --mono: "IBM Plex Mono", monospace;
      --sans: "Manrope", "Aptos", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(216, 141, 61, 0.12), transparent 36%),
        radial-gradient(circle at top right, rgba(13, 124, 102, 0.18), transparent 28%),
        linear-gradient(180deg, #f7f4eb 0%, #eef2ea 52%, #e5ede5 100%);
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      background: none;
      color: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(13, 124, 102, 0.5);
      box-shadow: 0 0 0 4px rgba(13, 124, 102, 0.12);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      gap: 14px;
      padding: 16px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-badge {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(13, 124, 102, 0.98), rgba(216, 141, 61, 0.9));
      color: white;
      font-weight: 800;
      letter-spacing: 0.08em;
      box-shadow: 0 12px 30px rgba(13, 124, 102, 0.18);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .search-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 8px 12px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(247, 248, 243, 0.94);
    }

    .search-shell input {
      border: 0;
      padding: 4px 0;
      background: transparent;
      box-shadow: none;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mode-toggle,
    .pill-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(246, 247, 241, 0.92);
      border: 1px solid var(--line);
    }

    .mode-toggle button,
    .pill-row button {
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .mode-toggle button.active,
    .pill-row button.active {
      background: white;
      color: var(--text);
      box-shadow: 0 4px 18px rgba(17, 39, 29, 0.08);
    }

    .mode-toggle button:hover,
    .pill-row button:hover,
    .button:hover,
    .ghost-button:hover,
    .mini-button:hover {
      transform: translateY(-1px);
    }

    .button,
    .ghost-button,
    .mini-button,
    .tag-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .button {
      color: white;
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      box-shadow: 0 12px 24px rgba(9, 94, 78, 0.18);
    }

    .ghost-button {
      color: var(--text);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
    }

    .ghost-button.soft {
      background: rgba(246, 247, 241, 0.88);
    }

    .ghost-button.warn {
      color: var(--warn);
      background: var(--warn-soft);
      border-color: rgba(154, 106, 20, 0.18);
    }

    .ghost-button.ok {
      color: var(--ok);
      background: var(--ok-soft);
      border-color: rgba(42, 122, 74, 0.18);
    }

    .ghost-button.brand {
      color: var(--brand-deep);
      background: var(--brand-soft);
      border-color: rgba(13, 124, 102, 0.18);
    }

    .ghost-button.danger {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: rgba(180, 81, 62, 0.18);
    }

    .mini-button {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      color: var(--text-soft);
    }

    .mini-button.active {
      background: var(--brand-soft);
      border-color: rgba(13, 124, 102, 0.22);
      color: var(--brand-deep);
    }

    .tag-button {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(13, 124, 102, 0.18);
      background: rgba(13, 124, 102, 0.08);
      color: var(--brand-deep);
    }

    .layout-shell {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr) minmax(320px, 380px);
      gap: 14px;
    }

    .app-shell.embed-shell {
      padding: 0;
      gap: 0;
      height: 100vh;
    }

    .layout-shell.embed-layout {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      height: 100vh;
    }

    .embed-layout .canvas-pane {
      border-radius: 0;
      border: 0;
      box-shadow: none;
      background: rgba(255, 255, 255, 0.92);
    }

    .pane {
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .pane-scroll {
      height: 100%;
      overflow: auto;
      padding: 18px;
    }

    .pane-scroll.tight {
      padding: 14px;
    }

    .section {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
    }

    .section-meta {
      font-size: 12px;
      color: var(--text-faint);
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
    }

    .card.soft {
      background: rgba(246, 247, 241, 0.9);
    }

    .card.warn {
      background: var(--warn-soft);
      border-color: rgba(154, 106, 20, 0.16);
    }

    .card.danger {
      background: var(--danger-soft);
      border-color: rgba(180, 81, 62, 0.16);
    }

    .card.ok {
      background: var(--ok-soft);
      border-color: rgba(42, 122, 74, 0.16);
    }

    .card.brand {
      background: var(--brand-soft);
      border-color: rgba(13, 124, 102, 0.16);
    }

    .stat-row,
    .space-between,
    .inline-row,
    .field-row,
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field-grid.one {
      grid-template-columns: minmax(0, 1fr);
    }

    .label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
    }

    .mono {
      font-family: var(--mono);
    }

    .hint {
      font-size: 12px;
      color: var(--text-faint);
      line-height: 1.45;
    }

    .micro {
      font-size: 11px;
      color: var(--text-faint);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-soft);
      background: rgba(241, 244, 237, 0.94);
      border: 1px solid var(--line);
    }

    .badge.brand {
      background: var(--brand-soft);
      border-color: rgba(13, 124, 102, 0.2);
      color: var(--brand-deep);
    }

    .badge.warn {
      background: var(--warn-soft);
      border-color: rgba(154, 106, 20, 0.2);
      color: var(--warn);
    }

    .badge.danger {
      background: var(--danger-soft);
      border-color: rgba(180, 81, 62, 0.2);
      color: var(--danger);
    }

    .badge.ok {
      background: var(--ok-soft);
      border-color: rgba(42, 122, 74, 0.2);
      color: var(--ok);
    }

    .library-card,
    .template-card {
      position: relative;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      display: grid;
      gap: 10px;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .library-card:hover,
    .template-card:hover {
      transform: translateY(-2px);
      border-color: rgba(13, 124, 102, 0.2);
      box-shadow: 0 18px 28px rgba(24, 48, 36, 0.08);
    }

    .library-card.active {
      border-color: rgba(13, 124, 102, 0.28);
      background: linear-gradient(180deg, rgba(13, 124, 102, 0.08), rgba(255, 255, 255, 0.92));
    }

    .library-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .library-meta,
    .library-foot {
      font-size: 12px;
      color: var(--text-faint);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .canvas-header {
      display: grid;
      gap: 14px;
      padding: 18px 18px 0;
    }

    .canvas-scroll {
      height: calc(100% - 128px);
      overflow: auto;
      padding: 0 18px 18px;
    }

    .hero-card {
      display: grid;
      gap: 16px;
      padding: 18px;
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(247, 248, 243, 0.86)),
        radial-gradient(circle at top right, rgba(216, 141, 61, 0.14), transparent 28%);
      border: 1px solid var(--line);
    }

    .hero-title {
      font-size: clamp(22px, 2vw, 28px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .hero-desc {
      max-width: 720px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-soft);
    }

    .runtime-filter-bar,
    .toolbar-strip,
    .filter-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .runtime-filter {
      display: grid;
      gap: 6px;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
    }

    .runtime-filter label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .tab-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      font-size: 13px;
      font-weight: 800;
      color: var(--text-soft);
    }

    .tab-button.active {
      background: white;
      color: var(--text);
      border-color: rgba(13, 124, 102, 0.18);
      box-shadow: 0 10px 22px rgba(18, 40, 31, 0.08);
    }

    .tab-button[draggable="true"] {
      cursor: grab;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .widget {
      position: relative;
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 28px rgba(19, 41, 31, 0.05);
      min-height: 180px;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .widget.active {
      border-color: rgba(13, 124, 102, 0.24);
      box-shadow: 0 20px 34px rgba(13, 124, 102, 0.12);
    }

    .widget:hover {
      transform: translateY(-2px);
    }

    .widget[draggable="true"] {
      cursor: grab;
    }

    .widget-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .widget-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .widget-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .widget-body {
      display: grid;
      gap: 12px;
      min-height: 0;
      align-content: start;
    }

    .skeleton {
      border-radius: 16px;
      min-height: 132px;
      background:
        linear-gradient(90deg, rgba(236, 239, 232, 0.8), rgba(255, 255, 255, 0.95), rgba(236, 239, 232, 0.8));
      background-size: 200% 100%;
      animation: shimmer 1.6s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .data-list-shell {
      overflow: auto;
      max-height: min(70vh, 560px);
      padding-right: 4px;
    }

    .mini-table th,
    .mini-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .mini-table th {
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .summary-chip {
      padding: 12px;
      border-radius: 16px;
      background: rgba(246, 247, 241, 0.92);
      border: 1px solid var(--line);
      display: grid;
      gap: 4px;
    }

    .summary-chip strong {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .summary-chip span {
      font-size: 12px;
      color: var(--text-faint);
    }

    .chart-shell {
      display: grid;
      gap: 8px;
    }

    .chart-bars {
      display: grid;
      gap: 10px;
    }

    .chart-bar-row {
      display: grid;
      gap: 6px;
    }

    .chart-bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-soft);
    }

    .chart-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(13, 124, 102, 0.09);
    }

    .chart-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand), #35a688);
    }

    .donut-shell {
      display: grid;
      place-items: center;
      padding: 16px 0;
    }

    .donut {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      position: relative;
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: white;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
    }

    .donut-center strong {
      display: block;
      font-size: 24px;
      color: var(--text);
      letter-spacing: -0.04em;
    }

    .vertical-chart {
      display: grid;
      gap: 12px;
    }

    .vertical-chart-bars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 12px;
      align-items: end;
      min-height: 180px;
    }

    .vertical-bar {
      display: grid;
      gap: 8px;
      align-items: end;
      justify-items: center;
    }

    .vertical-bar-column {
      width: 100%;
      min-height: 10px;
      border-radius: 16px 16px 8px 8px;
      background: linear-gradient(180deg, rgba(13, 124, 102, 0.92), rgba(53, 166, 136, 0.72));
    }

    .vertical-bar-label {
      text-align: center;
      font-size: 11px;
      color: var(--text-faint);
    }

    .line-chart svg,
    .area-chart svg {
      width: 100%;
      height: 220px;
      overflow: visible;
    }

    .line-chart polyline,
    .area-chart polyline {
      fill: none;
      stroke: var(--brand);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .area-chart polygon {
      fill: rgba(13, 124, 102, 0.16);
    }

    .stacked-track {
      display: flex;
      overflow: hidden;
      height: 18px;
      border-radius: 999px;
      background: rgba(13, 124, 102, 0.08);
    }

    .stacked-segment {
      height: 100%;
    }

    .stacked-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 12px;
      align-items: end;
      min-height: 180px;
    }

    .stacked-column {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .stacked-column-bar {
      width: 100%;
      min-height: 18px;
      border-radius: 16px 16px 8px 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      background: rgba(13, 124, 102, 0.08);
    }

    .funnel-chart {
      display: grid;
      gap: 10px;
    }

    .funnel-step {
      padding: 10px 12px;
      border-radius: 14px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      justify-self: center;
    }

    .heat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }

    .heat-cell {
      padding: 12px;
      border-radius: 16px;
      color: white;
      display: grid;
      gap: 4px;
      min-height: 88px;
      align-content: end;
    }

    .timeline-list,
    .kanban-list {
      display: grid;
      gap: 10px;
    }

    .timeline-item,
    .kanban-card {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      gap: 6px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .calendar-day {
      min-height: 132px;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(246, 247, 241, 0.88);
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .calendar-day strong {
      font-size: 12px;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .kanban-column {
      padding: 12px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(246, 247, 241, 0.92);
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .field-pick-shell {
      display: grid;
      gap: 12px;
    }

    .field-pick-list {
      display: grid;
      gap: 8px;
      max-height: 240px;
      overflow: auto;
      padding-right: 4px;
    }

    .field-pick-list.selected {
      max-height: 180px;
      gap: 6px;
    }

    .field-pick-button {
      justify-content: space-between;
      text-align: left;
      width: 100%;
    }

    .field-pick-button.active {
      background: rgba(13, 124, 102, 0.08);
      border-color: rgba(13, 124, 102, 0.22);
      color: var(--brand-deep);
    }

    .field-order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .field-order-label {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .field-order-label strong {
      font-size: 12px;
      line-height: 1.2;
    }

    .field-order-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-button.tiny {
      min-height: 26px;
      padding: 0 8px;
      font-size: 11px;
      border-radius: 9px;
    }

    .empty-state {
      display: grid;
      gap: 8px;
      place-items: center;
      padding: 28px 18px;
      min-height: 160px;
      border: 1px dashed rgba(27, 52, 40, 0.16);
      border-radius: 20px;
      background: rgba(246, 247, 241, 0.8);
      text-align: center;
    }

    .list-item {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
    }

    .draggable {
      cursor: grab;
    }

    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(246, 247, 241, 0.94);
      border: 1px solid var(--line);
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: 11px;
    }

    .option-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    .option-card {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      text-align: left;
      display: grid;
      gap: 6px;
    }

    .option-card.active {
      border-color: rgba(13, 124, 102, 0.24);
      background: rgba(13, 124, 102, 0.08);
    }

    .drawer-layer,
    .modal-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .drawer-layer {
      display: flex;
      justify-content: flex-end;
      padding: 16px;
    }

    .drawer {
      width: min(540px, calc(100vw - 32px));
      height: 100%;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 28px 60px rgba(20, 38, 28, 0.16);
      transform: translateX(108%);
      transition: transform 220ms ease;
      pointer-events: auto;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head,
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 248, 243, 0.86);
    }

    .drawer-body,
    .modal-body {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .modal-layer {
      display: grid;
      place-items: center;
      background: rgba(21, 34, 27, 0.28);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .modal-layer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(860px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 32px 72px rgba(18, 31, 24, 0.22);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toast-stack {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 10px;
      z-index: 60;
    }

    .toast {
      min-width: 280px;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 32px rgba(16, 29, 23, 0.14);
      display: grid;
      gap: 6px;
    }

    .toast.warn {
      background: rgba(255, 246, 230, 0.96);
      border-color: rgba(154, 106, 20, 0.16);
    }

    .toast.danger {
      background: rgba(255, 240, 236, 0.96);
      border-color: rgba(180, 81, 62, 0.16);
    }

    .toast.ok {
      background: rgba(238, 248, 241, 0.96);
      border-color: rgba(42, 122, 74, 0.16);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 6px rgba(13, 124, 102, 0.12);
    }

    .status-dot.warn {
      background: var(--warn);
      box-shadow: 0 0 0 6px rgba(154, 106, 20, 0.12);
    }

    .status-dot.danger {
      background: var(--danger);
      box-shadow: 0 0 0 6px rgba(180, 81, 62, 0.12);
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1320px) {
      .layout-shell {
        grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
      }

      .inspector-pane {
        display: none;
      }
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100vh;
      }

      .topbar,
      .layout-shell {
        grid-template-columns: 1fr;
      }

      .pane,
      .canvas-pane {
        min-height: 0;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .widget {
        grid-column: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "quickbase-reporting-studio-state-v1";
      const STORAGE_CONFIG_CACHE_KEY = "quickbase-reporting-studio-storage-config-v1";
      const DIRECT_STORAGE_CONFIG_RECORD_PREFIX = "__studio_storage_config__";
      const CURRENT_USER = {
        id: "donald.lundgren@northstar.example",
        name: "Donald Lundgren"
      };
      const MAX_HISTORY = 60;
      const QUICKBASE_WRITE_BATCH_SIZE = 200;
      const SOFT_EXPORT_LIMIT = 40000;
      const HARD_EXPORT_LIMIT = 120000;
      const COLORS = ["#0d7c66", "#d88d3d", "#5982c0", "#bb6744", "#68824b", "#9c7bd8"];
      const REPORT_VIEW_OPTIONS = [
        { value: "table", label: "Table" },
        { value: "summary", label: "Summary" },
        { value: "chart", label: "Chart" },
        { value: "timeline", label: "Timeline" },
        { value: "calendar", label: "Calendar" },
        { value: "kanban", label: "Kanban" }
      ];
      const CHART_STYLE_OPTIONS = [
        { value: "bar", label: "Bar" },
        { value: "column", label: "Column" },
        { value: "line", label: "Line" },
        { value: "area", label: "Area" },
        { value: "donut", label: "Donut" },
        { value: "pie", label: "Pie" },
        { value: "stacked-bar", label: "Stacked bar" },
        { value: "stacked-column", label: "Stacked column" },
        { value: "funnel", label: "Funnel" },
        { value: "heatmap", label: "Heatmap" }
      ];

      let state = null;
      let dragPayload = null;
      let appNode = null;
      let renderFocusState = null;
      let renderScrollState = null;
      let objectDataRefreshTimer = null;
      let syncingRouteFromLocation = false;

      function uid(prefix) {
        return prefix + "_" + Math.random().toString(36).slice(2, 10);
      }

      function deepClone(value) {
        return typeof structuredClone === "function"
          ? structuredClone(value)
          : JSON.parse(JSON.stringify(value));
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function fmtDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function fmtDateTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function cap(value, length) {
        const text = String(value ?? "");
        return text.length > length ? text.slice(0, length - 1) + "…" : text;
      }

      function titleCase(value) {
        return String(value ?? "")
          .replace(/[_-]+/g, " ")
          .replace(/\b\w/g, char => char.toUpperCase());
      }

      function camelToKebab(value) {
        return String(value || "").replace(/[A-Z]/g, letter => "-" + letter.toLowerCase());
      }

      function parseTagList(value) {
        return String(value || "")
          .split(",")
          .map(item => item.trim())
          .filter(Boolean);
      }

      function csvSplit(value) {
        const line = value.trim();
        if (!line) return [];
        const result = [];
        let current = "";
        let quoteOpen = false;
        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          if (char === '"') {
            if (quoteOpen && line[index + 1] === '"') {
              current += '"';
              index += 1;
            } else {
              quoteOpen = !quoteOpen;
            }
          } else if (char === "," && !quoteOpen) {
            result.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current.trim());
        return result;
      }

      function parseCsv(text) {
        const rows = String(text || "")
          .split(/\r?\n/)
          .filter(line => line.trim().length);
        if (!rows.length) return { headers: [], records: [] };
        const headers = csvSplit(rows[0]);
        const records = rows.slice(1).map(line => {
          const values = csvSplit(line);
          const record = {};
          headers.forEach((header, index) => {
            record[header] = values[index] ?? "";
          });
          return record;
        });
        return { headers, records };
      }

      function nextTick() {
        return new Promise(resolve => requestAnimationFrame(() => resolve()));
      }

      function getHostedRouteContext() {
        if (typeof window === "undefined" || !window.location) {
          return { embed: false, mode: "", forcedViewer: false };
        }
        const params = new URLSearchParams(window.location.search);
        const mode = params.get("mode") === "viewer"
          ? "viewer"
          : params.get("mode") === "builder"
            ? "builder"
            : "";
        const embed = params.get("embed") === "1";
        return {
          embed,
          mode,
          forcedViewer: embed || mode === "viewer"
        };
      }

      function buildObjectHash(object) {
        if (!object?.id || !object?.type) return "";
        return "#/" + encodeURIComponent(object.type) + "/" + encodeURIComponent(object.id);
      }

      function buildObjectRouteLabel(object) {
        return buildObjectHash(object) || "#/";
      }

      function buildHostedObjectUrl(object, options = {}) {
        if (typeof window === "undefined" || !window.location || !object) return "";
        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        const embed = options.embed === true;
        const mode = options.mode || "";
        if (embed) params.set("embed", "1");
        else params.delete("embed");
        if (mode) params.set("mode", mode);
        else params.delete("mode");
        url.search = params.toString() ? "?" + params.toString() : "";
        url.hash = buildObjectHash(object);
        return url.toString();
      }

      function objectLinkForKind(object, kind = "default") {
        if (!object) return "";
        if (kind === "viewer") return buildHostedObjectUrl(object, { mode: "viewer" });
        if (kind === "embed") return buildHostedObjectUrl(object, { mode: "viewer", embed: true });
        return buildHostedObjectUrl(object);
      }

      function parseHostedObjectRoute() {
        if (typeof window === "undefined" || !window.location) return null;
        const hash = String(window.location.hash || "").replace(/^#/, "");
        const path = hash.split("?")[0];
        const parts = path.split("/").filter(Boolean).map(item => decodeURIComponent(item));
        if (parts.length < 2) return null;
        return {
          type: parts[0],
          id: parts[1]
        };
      }

      function syncDocumentTitle() {
        if (typeof document === "undefined") return;
        const object = state ? getActiveObject() : null;
        document.title = object ? (object.name + " · Quickbase Reporting Studio") : "Quickbase Reporting Studio";
      }

      function syncRouteFromState() {
        if (typeof window === "undefined" || !window.location) return;
        const object = getActiveObject();
        if (!object || syncingRouteFromLocation) {
          syncDocumentTitle();
          return;
        }
        const nextUrl = window.location.pathname + window.location.search + buildObjectHash(object);
        const currentUrl = window.location.pathname + window.location.search + window.location.hash;
        if (nextUrl !== currentUrl) {
          window.history.replaceState(null, "", nextUrl);
        }
        syncDocumentTitle();
      }

      async function copyTextToClipboard(text, successMessage = "Copied to clipboard.") {
        const value = String(text || "");
        if (!value) {
          pushToast("Nothing to copy yet.", "warn");
          return;
        }
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            await navigator.clipboard.writeText(value);
          } else {
            const input = document.createElement("textarea");
            input.value = value;
            input.setAttribute("readonly", "readonly");
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            document.body.removeChild(input);
          }
          pushToast(successMessage, "ok");
        } catch (error) {
          console.error(error);
          pushToast("Unable to copy the link.", "danger");
        }
      }

      function defaultSystemState() {
        return {
          providerMode: "local",
          pendingSync: false,
          pendingReason: "",
          syncStatus: "local",
          syncMessage: "Working in browser-only mode. Add a secure backend or proxy before enabling Quickbase live sync on a public host.",
          lastSyncAt: "",
          lastMetadataRefreshAt: "",
          quickbase: {
            apiBaseUrl: "https://api.quickbase.com/v1",
            realmHostname: "",
            userToken: "",
            appId: "",
            bootstrapPath: "/bootstrap",
            savePath: "/save",
            metadataPath: "/metadata",
            exportPath: "/export",
            bootstrapOnLoad: false,
            useRemoteExport: false,
            storage: {
              objectTableId: "",
              objectKeyFieldId: "",
              objectTypeFieldId: "",
              objectNameFieldId: "",
              objectConfigFieldId: "",
              objectOwnerFieldId: "",
              objectUpdatedAtFieldId: "",
              objectUpdatedByFieldId: "",
              userSettingsTableId: "",
              settingsUserFieldId: "",
              settingsObjectFieldId: "",
              settingsObjectKeyFieldId: "",
              settingsJsonFieldId: "",
              settingsUpdatedByFieldId: "",
              versionTableId: "",
              versionObjectFieldId: "",
              versionObjectKeyFieldId: "",
              versionSnapshotFieldId: "",
              versionChangedAtFieldId: "",
              versionChangedByFieldId: "",
              versionUpdatedByFieldId: ""
            }
          }
        };
      }

      function ensureSystemState(input) {
        const defaults = defaultSystemState();
        const system = Object.assign({}, defaults, input || {});
        system.quickbase = Object.assign({}, defaults.quickbase, (input && input.quickbase) || {});
        system.quickbase.storage = Object.assign({}, defaults.quickbase.storage, (input && input.quickbase && input.quickbase.storage) || {});
        return system;
      }

      function quickbaseScopeKey(config = null) {
        const source = config || state?.system?.quickbase || defaultSystemState().quickbase;
        const apiBaseUrl = String(source.apiBaseUrl || "").trim().replace(/\/$/, "").toLowerCase();
        const realmHostname = String(source.realmHostname || "").trim().toLowerCase();
        const appId = String(source.appId || "").trim();
        if (!apiBaseUrl && !realmHostname && !appId) return "";
        return [apiBaseUrl || "https://api.quickbase.com/v1", realmHostname, appId].join("|");
      }

      function directStorageConfigRecordKey(config = null) {
        const scope = quickbaseScopeKey(config);
        return scope ? DIRECT_STORAGE_CONFIG_RECORD_PREFIX + "|" + scope : DIRECT_STORAGE_CONFIG_RECORD_PREFIX;
      }

      function isDirectStorageConfigRecordKey(value) {
        return String(value || "").startsWith(DIRECT_STORAGE_CONFIG_RECORD_PREFIX);
      }

      function normalizeQuickbaseStorageConfig(storage) {
        const defaults = defaultSystemState().quickbase.storage;
        const normalized = {};
        Object.keys(defaults).forEach(key => {
          const value = String(storage?.[key] || "").trim();
          if (value) normalized[key] = value;
        });
        return normalized;
      }

      function readQuickbaseStorageCache() {
        try {
          const raw = localStorage.getItem(STORAGE_CONFIG_CACHE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (error) {
          console.error(error);
          return {};
        }
      }

      function writeQuickbaseStorageCache(cache) {
        try {
          localStorage.setItem(STORAGE_CONFIG_CACHE_KEY, JSON.stringify(cache || {}));
        } catch (error) {
          console.error(error);
        }
      }

      function persistScopedQuickbaseStorageConfig(config = null) {
        const source = config || state?.system?.quickbase;
        if (!source) return;
        const scope = quickbaseScopeKey(source);
        if (!scope) return;
        const cache = readQuickbaseStorageCache();
        const normalized = normalizeQuickbaseStorageConfig(source.storage);
        if (Object.keys(normalized).length) {
          cache[scope] = normalized;
        } else {
          delete cache[scope];
        }
        writeQuickbaseStorageCache(cache);
      }

      function restoreScopedQuickbaseStorageConfig(config = null, options = {}) {
        const { replace = false } = options;
        const source = config || state?.system?.quickbase;
        if (!source) return false;
        const scope = quickbaseScopeKey(source);
        if (!scope) return false;
        const cache = readQuickbaseStorageCache();
        const cached = cache[scope];
        if (!cached || typeof cached !== "object") return false;
        const defaults = defaultSystemState().quickbase.storage;
        source.storage = replace
          ? Object.assign({}, defaults, cached)
          : Object.assign({}, defaults, cached, source.storage || {});
        return true;
      }

      function resetQuickbaseStorageConfig(config = null) {
        const source = config || state?.system?.quickbase;
        if (!source) return;
        source.storage = Object.assign({}, defaultSystemState().quickbase.storage);
      }

      function initializeStateShape(loaded) {
        const shaped = loaded || createSeedState();
        shaped.sessions = shaped.sessions || {};
        shaped.sessions.resultCache = {};
        shaped.sessions.previewFieldIds = shaped.sessions.previewFieldIds || {};
        shaped.sessions.previewLoads = shaped.sessions.previewLoads || {};
        shaped.history = { undo: [], redo: [] };
        shaped.system = ensureSystemState(shaped.system);
        shaped.ui = Object.assign({
          mode: "builder",
          libraryQuery: "",
          libraryType: "all",
          libraryOwner: "all",
          libraryFavoritesOnly: false,
          libraryRecentOnly: false,
          activeObjectId: null,
          selectedWidgetId: null,
          selectedTabId: null,
          objectInspectorTab: "design",
          reportInspectorTab: "fields",
          widgetSearch: "",
          fieldSearch: "",
          drawer: null,
          modal: null,
          yamlDraft: "",
          yamlPreview: null,
          createDraft: {
            type: "dashboard",
            name: "",
            templateId: "",
            tableId: "",
            selectedFieldIds: [],
            filters: [],
            sorts: [],
            fieldQuery: "",
            viewMode: "table",
            chartType: "bar",
            chartFieldId: "",
            timelineDateField: "",
            timelineEndField: "",
            calendarDateField: "",
            kanbanField: "",
            titleFieldId: ""
          },
          addWidgetDraft: {
            source: "existing",
            reportId: "",
            mode: "linked",
            tabId: "",
            name: "",
            tableId: "",
            selectedFieldIds: [],
            filters: [],
            sorts: [],
            fieldQuery: "",
            viewMode: "table",
            chartType: "bar",
            chartFieldId: "",
            timelineDateField: "",
            timelineEndField: "",
            calendarDateField: "",
            kanbanField: "",
            titleFieldId: ""
          },
          uploadSession: null,
          toasts: [],
          widgetLoadState: {}
        }, shaped.ui || {});
        shaped.ui.createDraft = Object.assign({
          type: "dashboard",
          name: "",
          templateId: "",
          tableId: "",
          selectedFieldIds: [],
          filters: [],
          sorts: [],
          fieldQuery: "",
          viewMode: "table",
          chartType: "bar",
          chartFieldId: "",
          timelineDateField: "",
          timelineEndField: "",
          calendarDateField: "",
          kanbanField: "",
          titleFieldId: ""
        }, shaped.ui.createDraft || {});
        shaped.ui.addWidgetDraft = Object.assign({
          source: "existing",
          reportId: "",
          mode: "linked",
          tabId: "",
          name: "",
          tableId: "",
          selectedFieldIds: [],
          filters: [],
          sorts: [],
          fieldQuery: "",
          viewMode: "table",
          chartType: "bar",
          chartFieldId: "",
          timelineDateField: "",
          timelineEndField: "",
          calendarDateField: "",
          kanbanField: "",
          titleFieldId: ""
        }, shaped.ui.addWidgetDraft || {});
        normalizeStudioState(shaped);
        return shaped;
      }

      function fieldExists(table, fieldId) {
        return Boolean(table && table.fields.some(field => field.id === fieldId));
      }

      function isDateField(field) {
        return ["date", "datetime"].includes(field?.type);
      }

      function isGroupingField(field) {
        return ["text", "lookup", "user", "multiselect", "formula-text"].includes(field?.type);
      }

      function isTitleField(field) {
        return ["text", "lookup", "user", "formula-text"].includes(field?.type);
      }

      function isChartField(field) {
        return isGroupingField(field) || isDateField(field);
      }

      function buildReportViewDefaults(table, fieldIds, mode = "table") {
        return {
          mode,
          chartType: "bar",
          chartFieldId: "",
          timelineDateField: "",
          timelineEndField: "",
          calendarDateField: "",
          kanbanField: "",
          titleFieldId: ""
        };
      }

      function ensureReportViewConfig(report, tablesOverride = null) {
        if (!report || report.type !== "report") return report;
        report.selectedFields = Array.isArray(report.selectedFields) ? report.selectedFields : [];
        report.summary = report.summary || { metrics: [] };
        report.summary.metrics = Array.isArray(report.summary.metrics) ? report.summary.metrics : [];
        const table = tablesOverride
          ? tablesOverride.find(item => item.id === report.source?.tableId) || null
          : resolveTable(report.source?.tableId);
        const selectedFieldIds = report.selectedFields.map(item => item.fieldId).filter(Boolean);
        const defaults = buildReportViewDefaults(
          table,
          selectedFieldIds,
          report.view?.mode || (report.chart?.enabled ? "chart" : "table")
        );
        if (!report.view && report.chart?.labelField && fieldExists(table, report.chart.labelField)) {
          defaults.chartFieldId = report.chart.labelField;
        }
        report.view = Object.assign({}, defaults, report.view || {});
        if (!REPORT_VIEW_OPTIONS.some(option => option.value === report.view.mode)) report.view.mode = defaults.mode;
        if (!CHART_STYLE_OPTIONS.some(option => option.value === report.view.chartType)) report.view.chartType = defaults.chartType;
        ["chartFieldId", "timelineDateField", "timelineEndField", "calendarDateField", "kanbanField", "titleFieldId"].forEach(key => {
          if (report.view[key] && !fieldExists(table, report.view[key])) {
            report.view[key] = defaults[key] || "";
          }
        });
        report.chart = Object.assign({
          enabled: report.view.mode === "chart",
          type: report.view.chartType,
          labelField: report.view.chartFieldId
        }, report.chart || {});
        report.chart.enabled = report.view.mode === "chart";
        report.chart.type = report.view.chartType;
        report.chart.labelField = report.view.chartFieldId;
        if (!report.summary.metrics.length && selectedFieldIds[0]) {
          report.summary.metrics = [
            { id: uid("metric"), fieldId: selectedFieldIds[0], op: "count", label: "Rows" }
          ];
        }
        return report;
      }

      function normalizeStudioState(targetState) {
        const tables = targetState.metadata?.tables || [];
        const normalizeObject = object => {
          if (!object || typeof object !== "object") return;
          if (object.type === "report") ensureReportViewConfig(object, tables);
          if (object.type === "dashboard") {
            (object.tabs || []).forEach(tab => {
              (tab.widgets || []).forEach(widget => {
                if (widget.reportRef?.snapshot) ensureReportViewConfig(widget.reportRef.snapshot, tables);
              });
            });
          }
        };
        Object.values(targetState.catalog?.objects || {}).forEach(normalizeObject);
        Object.values(targetState.versions || {}).forEach(list => (list || []).forEach(entry => normalizeObject(entry.snapshot)));
        ["layouts", "yaml"].forEach(bucket => {
          (targetState.templates?.[bucket] || []).forEach(template => normalizeObject(template.template));
        });
      }

      function applyDraftViewToReport(report, draft, table) {
        report.view = {
          mode: draft.viewMode || "table",
          chartType: draft.chartType || "bar",
          chartFieldId: draft.chartFieldId || "",
          timelineDateField: draft.timelineDateField || "",
          timelineEndField: draft.timelineEndField || "",
          calendarDateField: draft.calendarDateField || "",
          kanbanField: draft.kanbanField || "",
          titleFieldId: draft.titleFieldId || ""
        };
        ensureReportViewConfig(report);
      }

      function buildCreateDraft(type = "dashboard") {
        const firstTable = state?.metadata?.tables?.[0] || null;
        const selectedFieldIds = [];
        const defaults = buildReportViewDefaults(firstTable, selectedFieldIds, "table");
        return {

          templateId: "",
          tableId: firstTable?.id || "",
          selectedFieldIds,
          filters: [],
          sorts: [],
          fieldQuery: "",

          chartType: defaults.chartType,
          chartFieldId: defaults.chartFieldId,
          timelineDateField: defaults.timelineDateField,
          timelineEndField: defaults.timelineEndField,
          calendarDateField: defaults.calendarDateField,
          kanbanField: defaults.kanbanField,
          titleFieldId: defaults.titleFieldId
        };
      }

      function maskToken(value) {
        const text = String(value || "");
        if (text.length <= 8) return text ? "••••" : "";
        return text.slice(0, 4) + "••••" + text.slice(-4);
      }

      function providerLabel() {
        return state.system.providerMode === "quickbase" ? "Quickbase sync" : "Browser only";
      }

      function syncTone() {
        const status = state.system.syncStatus;
        if (status === "error") return "danger";
        if (status === "pending") return "warn";
        if (status === "running") return "brand";
        if (status === "ok") return "ok";

      }

      function setSyncState(status, message, timestamp) {

      function sanitizeForStorage(sourceState) {

      function quickbaseConfigured() {
        const config = state.system.quickbase;
        return Boolean(String(config.apiBaseUrl || "").trim())
          && Boolean(String(config.realmHostname || "").trim())
          && Boolean(String(config.appId || "").trim())
          && Boolean(String(config.userToken || "").trim());
      }

      function usingDirectQuickbaseApi() {
        return String(state.system.quickbase.apiBaseUrl || "").trim().replace(/\/$/, "") === "https://api.quickbase.com/v1";
      }

      function directQuickbaseStorage() {
        return state.system.quickbase.storage || {};
      }

      function hasDirectQuickbaseObjectStorage() {
        const storage = directQuickbaseStorage();
        return Boolean(storage.objectTableId)
          && Boolean(storage.objectTypeFieldId)
          && Boolean(storage.objectNameFieldId)
          && Boolean(storage.objectConfigFieldId);
      }

      function hasDirectQuickbaseSettingsStorage() {
        const storage = directQuickbaseStorage();
        return Boolean(storage.userSettingsTableId)
          && Boolean(storage.settingsUserFieldId)
          && Boolean(storage.settingsObjectKeyFieldId)
          && Boolean(storage.settingsJsonFieldId);
      }

      function hasDirectQuickbaseVersionStorage() {
        const storage = directQuickbaseStorage();
        return Boolean(storage.versionTableId)
          && Boolean(storage.versionObjectKeyFieldId)
          && Boolean(storage.versionSnapshotFieldId)
          && Boolean(storage.versionChangedAtFieldId);
      }

      function directQuickbaseObjectStorageMissing() {
        const storage = directQuickbaseStorage();
        const missing = [];
        if (!storage.objectTableId) missing.push("studio items table DBID");
        if (!storage.objectTypeFieldId) missing.push("studio item type field FID");
        if (!storage.objectNameFieldId) missing.push("studio item name field FID");
        if (!storage.objectConfigFieldId) missing.push("studio item JSON field FID");
        return missing;
      }

      function qbFieldId(fid) {
        const number = Number(fid);
        return Number.isFinite(number) ? number : fid;
      }

      function compactQuickbaseFieldIds(fids) {
        return Array.from(new Set((fids || [])
          .filter(fid => fid !== undefined && fid !== null && fid !== "")
          .map(qbFieldId)));
      }

      function qbFieldKey(fid) {
        return String(qbFieldId(fid));
      }

      function qbFieldValue(record, fid) {
        if (!record || !fid) return "";
        const entry = record[qbFieldKey(fid)] || record[String(fid)];
        return entry && typeof entry === "object" && "value" in entry ? entry.value : "";
      }

      function qbSetField(data, fid, value) {
        if (!fid) return;
        data[qbFieldKey(fid)] = { value };
      }

      function safeJsonParse(text, fallback = null) {
        try {
          return text ? JSON.parse(text) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function escapeQuickbaseQueryValue(value) {
        return String(value ?? "")
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'");
      }

      function buildQuickbaseWhere(clauses) {
        return (clauses || [])
          .filter(clause => clause && clause.fid && clause.value !== undefined && clause.value !== null && clause.value !== "")
          .map(clause => `{'${qbFieldId(clause.fid)}'.${clause.operator || "EX"}.'${escapeQuickbaseQueryValue(clause.value)}'}`)
          .join("AND");
      }

      function normalizeQuickbaseRealmHostname(value) {
        return String(value || "")
          .trim()
          .replace(/^https?:\/\//i, "")
          .replace(/\/.*$/, "")
          .toLowerCase();
      }

      function quickbaseCurrentRealmHostname() {
        return typeof window !== "undefined" && window.location ? normalizeQuickbaseRealmHostname(window.location.hostname) : "";
      }

      function quickbaseUseSameOriginXmlApi() {
        if (!usingDirectQuickbaseApi() || !quickbaseConfigured()) return false;
        const configuredRealm = normalizeQuickbaseRealmHostname(state.system.quickbase.realmHostname);
        const currentRealm = quickbaseCurrentRealmHostname();
        return Boolean(configuredRealm) && configuredRealm === currentRealm;
      }

      function quickbaseXmlEscape(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function quickbaseXmlDbUrl(dbid) {
        if (typeof window === "undefined" || !window.location) {
          throw new Error("Quickbase XML fallback requires a browser context.");
        }
        return window.location.origin.replace(/\/$/, "") + "/db/" + encodeURIComponent(String(dbid || "").trim());
      }

      function quickbaseXmlText(root, selector) {
        if (!root || !selector) return "";
        const node = root.querySelector(selector);
        return node ? String(node.textContent || "").trim() : "";
      }

      function quickbaseXmlParse(text, action) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "application/xml");
        if (doc.querySelector("parsererror")) {
          throw new Error("Quickbase " + action + " returned invalid XML.");
        }
        const errcode = Number(quickbaseXmlText(doc, "qdbapi > errcode") || quickbaseXmlText(doc, "errcode") || 0);
        if (Number.isFinite(errcode) && errcode !== 0) {
          throw new Error(quickbaseXmlText(doc, "qdbapi > errtext") || quickbaseXmlText(doc, "errtext") || ("Quickbase " + action + " failed."));
        }
        return doc;
      }

      async function quickbaseXmlRequest(dbid, action, innerXml = "") {
        const config = state.system.quickbase;
        const response = await fetch(quickbaseXmlDbUrl(dbid), {
          method: "POST",
          headers: {
            Accept: "application/xml, text/xml;q=0.9, */*;q=0.8",
            "Content-Type": "application/xml; charset=UTF-8",
            "QUICKBASE-ACTION": action
          },
          body: `<qdbapi><usertoken>${quickbaseXmlEscape(config.userToken)}</usertoken>${innerXml || ""}</qdbapi>`
        });
        const text = await response.text();
        if (!response.ok) {
          try {
            const doc = quickbaseXmlParse(text, action);
            throw new Error(quickbaseXmlText(doc, "qdbapi > errtext") || quickbaseXmlText(doc, "errtext") || ("Quickbase " + action + " failed with status " + response.status + "."));
          } catch (error) {
            throw new Error(error.message || ("Quickbase " + action + " failed with status " + response.status + "."));
          }
        }
        return quickbaseXmlParse(text, action);
      }

      function quickbaseXmlFieldMode(fieldNode) {
        if (!fieldNode) return "";
        const attributeMode = String(fieldNode.getAttribute("mode") || "").trim().toLowerCase();
        if (attributeMode) return attributeMode;
        if (quickbaseXmlText(fieldNode, "lookup") === "1") return "lookup";
        if (quickbaseXmlText(fieldNode, "summaryfield") === "1" || quickbaseXmlText(fieldNode, "summary") === "1") return "summary";
        if (quickbaseXmlText(fieldNode, "formula") === "1") return "formula";
        return "";
      }

      function normalizeQuickbaseXmlField(fieldNode) {
        const choices = Array.from(fieldNode.querySelectorAll("choices > choice"))
          .map(choice => String(choice.textContent || "").trim())
          .filter(Boolean);
        return normalizeQuickbaseField({
          id: fieldNode.getAttribute("id") || "",
          label: quickbaseXmlText(fieldNode, "label"),
          fieldType: String(fieldNode.getAttribute("field_type") || fieldNode.getAttribute("base_type") || "").trim().toLowerCase(),
          mode: quickbaseXmlFieldMode(fieldNode),
          properties: choices.length ? { choices } : undefined
        });
      }

      async function quickbaseFetchAppInfo() {
        const appId = state.system.quickbase.appId;
        if (!quickbaseUseSameOriginXmlApi()) {
          return quickbaseFetch("/apps/" + encodeURIComponent(appId));
        }
        const doc = await quickbaseXmlRequest(appId, "API_GetSchema");
        return {
          id: appId,
          name: quickbaseXmlText(doc, "table > name"),
          description: quickbaseXmlText(doc, "table > desc"),
          updated: quickbaseXmlText(doc, "table > original > mod_date")
        };
      }

      async function quickbaseQueryRecordsXml(tableId, select, where = "", options = {}) {
        const fields = compactQuickbaseFieldIds(select || []);
        const sortBy = Array.isArray(options.sortBy) ? options.sortBy.filter(Boolean) : [];
        const sortFieldIds = compactQuickbaseFieldIds(sortBy.map(item => item.fieldId));
        const optionParts = ["num-" + Math.max(1, Number(options.top) || 200)];
        if (Number(options.skip) > 0) optionParts.push("skp-" + Number(options.skip));
        if (sortBy.length) {
          optionParts.push("sortorder-" + sortBy.map(item => String(item.order || "").toUpperCase() === "DESC" ? "D" : "A").join(""));
        }
        const doc = await quickbaseXmlRequest(tableId, "API_DoQuery", [
          where ? `<query>${quickbaseXmlEscape(where)}</query>` : "",
          fields.length ? `<clist>${quickbaseXmlEscape(fields.join("."))}</clist>` : "",
          sortFieldIds.length ? `<slist>${quickbaseXmlEscape(sortFieldIds.join("."))}</slist>` : "",
          `<options>${quickbaseXmlEscape(optionParts.join("."))}</options>`,
          "<fmt>structured</fmt>"
        ].join(""));
        return {
          data: Array.from(doc.querySelectorAll("records > record")).map(recordNode => {
            const row = {};
            Array.from(recordNode.querySelectorAll("f")).forEach(fieldNode => {
              const fieldId = String(fieldNode.getAttribute("id") || "").trim();
              if (!fieldId) return;
              row[fieldId] = { value: fieldNode.textContent || "" };
            });
            return row;
          })
        };
      }

      async function quickbaseWriteRecordsXml(tableId, rows) {
        const savedRows = [];
        for (const row of rows || []) {
          const recordId = qbFieldValue(row, 3);
          const fieldXml = Object.entries(row || {})
            .filter(([fid, entry]) => String(fid) !== "3" && entry && typeof entry === "object" && "value" in entry && entry.value !== undefined && entry.value !== null)
            .map(([fid, entry]) => `<field fid="${quickbaseXmlEscape(fid)}">${quickbaseXmlEscape(entry.value)}</field>`)
            .join("");
          const doc = await quickbaseXmlRequest(
            tableId,
            recordId ? "API_EditRecord" : "API_AddRecord",
            [
              recordId ? `<rid>${quickbaseXmlEscape(recordId)}</rid>` : "",
              "<ignoreError>1</ignoreError>",
              "<clist>3</clist>",
              fieldXml
            ].join("")
          );
          const savedRecordId = quickbaseXmlText(doc, "qdbapi > rid") || quickbaseXmlText(doc, "rid") || recordId;
          savedRows.push({
            "3": { value: savedRecordId ? String(savedRecordId) : "" }
          });
        }
        return { data: savedRows };
      }

      async function loadQuickbaseMetadataXml() {
        const appId = state.system.quickbase.appId;
        const appDoc = await quickbaseXmlRequest(appId, "API_GetSchema");
        const tableIds = Array.from(appDoc.querySelectorAll("chdbids > chdbid"))
          .map(node => String(node.textContent || "").trim())
          .filter(Boolean);
        const tableDocs = await Promise.all(tableIds.map(tableId => quickbaseXmlRequest(tableId, "API_GetSchema")));
        return {
          app: {
            id: appId,
            name: quickbaseXmlText(appDoc, "table > name"),
            updated: quickbaseXmlText(appDoc, "table > original > mod_date"),
            description: quickbaseXmlText(appDoc, "table > desc")
          },
          tables: tableDocs.map(doc => ({
            id: quickbaseXmlText(doc, "table > original > table_id") || quickbaseXmlText(doc, "table > original > app_id"),
            name: quickbaseXmlText(doc, "table > name"),
            description: quickbaseXmlText(doc, "table > desc"),
            quickbase: {
              id: quickbaseXmlText(doc, "table > original > table_id") || quickbaseXmlText(doc, "table > original > app_id"),
              name: quickbaseXmlText(doc, "table > name")
            },
            fields: Array.from(doc.querySelectorAll("table > fields > field")).map(normalizeQuickbaseXmlField)
          }))
        };
      }

      function buildProviderPayload(scope) {
        return {
          scope: scope || "full",
          sentAt: nowIso(),
          currentUser: deepClone(CURRENT_USER),
          bundle: {
            catalog: deepClone(state.catalog),
            preferences: deepClone(state.preferences),
            versions: deepClone(state.versions),
            templates: deepClone(state.templates),
            exportJobs: deepClone(state.exportJobs),
            metadata: deepClone(state.metadata)
          }
        };
      }

      async function quickbaseRequest(path, payload) {
        const config = state.system.quickbase;
        const baseUrl = String(config.apiBaseUrl || "").trim().replace(/\/$/, "");
        if (!baseUrl) throw new Error("Add the Quickbase endpoint URL first.");
        const suffix = String(path || "").trim();
        const url = /^https?:\/\//i.test(suffix) ? suffix : baseUrl + suffix;
        const headers = {
          Accept: "application/json",
          "Content-Type": "application/json"
        };
        if (config.realmHostname) headers["QB-Realm-Hostname"] = config.realmHostname;
        if (config.userToken) headers.Authorization = "QB-USER-TOKEN " + config.userToken;
        if (config.appId) headers["X-Quickbase-App-Id"] = config.appId;
        const response = await fetch(url, {
          method: "POST",
          headers,
          body: JSON.stringify(payload || {})
        });
        const text = await response.text();
        let body = null;
        try {
          body = text ? JSON.parse(text) : {};
        } catch (error) {
          body = { message: text };
        }
        if (!response.ok) {
          throw new Error(body?.message || body?.error || ("Request failed with status " + response.status + "."));
        }
        return body;
      }

      async function quickbaseFetch(path, options = {}) {
        const config = state.system.quickbase;
        const baseUrl = String(config.apiBaseUrl || "").trim().replace(/\/$/, "");
        if (!quickbaseConfigured()) throw new Error("Add the realm, app ID, and user token first.");
        const url = /^https?:\/\//i.test(path) ? path : baseUrl + path;
        const headers = Object.assign({
          Accept: "application/json",
          "QB-Realm-Hostname": config.realmHostname,
          Authorization: "QB-USER-TOKEN " + config.userToken
        }, options.headers || {});
        const response = await fetch(url, {
          method: options.method || "GET",
          headers,
          body: options.body
        });
        const text = await response.text();
        let body = null;
        try {
          body = text ? JSON.parse(text) : {};
        } catch (error) {
          body = { message: text };
        }
        if (!response.ok) {
          throw new Error(body?.message || body?.description || ("Request failed with status " + response.status + "."));
        }
        return body;
      }

      async function quickbaseQueryRecords(tableId, select, where = "", options = {}) {
        if (quickbaseUseSameOriginXmlApi()) {
          return quickbaseQueryRecordsXml(tableId, select, where, options);
        }
        const payload = {
          from: tableId,
          select: compactQuickbaseFieldIds(select || []),
          options: {
            top: options.top || 200,
            skip: options.skip || 0
          }
        };
        if (where) payload.where = where;
        if (options.sortBy) payload.sortBy = options.sortBy;
        return quickbaseFetch("/records/query", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
      }

      async function quickbaseFetchAllRecords(tableId, select, where = "", options = {}) {
        const top = options.top || 200;
        const rows = [];
        let skip = 0;
        while (skip < 10000) {
          const response = await quickbaseQueryRecords(tableId, select, where, { top, skip, sortBy: options.sortBy });
          const chunk = response.data || [];
          rows.push(...chunk);
          if (chunk.length < top) break;
          skip += top;
        }
        return rows;
      }

      async function quickbaseWriteRecords(tableId, rows) {
        if (quickbaseUseSameOriginXmlApi()) {
          return quickbaseWriteRecordsXml(tableId, rows);
        }
        return quickbaseFetch("/records", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            to: tableId,
            data: rows,
            fieldsToReturn: [3]
          })
        });
      }

      function makeQuickbaseCompositeKey(parts) {
        return (parts || []).map(part => String(part ?? "")).join("\u001f");
      }

      async function quickbaseWriteRecordBatches(tableId, rows, batchSize = QUICKBASE_WRITE_BATCH_SIZE) {
        const savedRows = [];
        for (let index = 0; index < rows.length; index += batchSize) {
          const chunk = rows.slice(index, index + batchSize);
          if (!chunk.length) continue;
          const response = await quickbaseWriteRecords(tableId, chunk);
          savedRows.push(...(response.data || []));
        }
        return savedRows;
      }

      async function quickbaseFetchRecordIdMap(tableId, keyFids, options = {}) {
        const select = [3].concat((keyFids || []).filter(Boolean));
        const rows = await quickbaseFetchAllRecords(tableId, select, options.where || "", {
          top: options.top || 200,
          sortBy: options.sortBy
        });
        const map = new Map();
        rows.forEach(row => {
          const key = makeQuickbaseCompositeKey(keyFids.map(fid => qbFieldValue(row, fid)));
          if (!key.replace(/\u001f/g, "").length) return;
          const recordId = qbFieldValue(row, 3);
          if (recordId) map.set(key, String(recordId));
        });
        return map;
      }

      async function quickbaseFindRecordId(tableId, whereClauses) {
        const where = buildQuickbaseWhere(whereClauses);
        if (!where) return "";
        const response = await quickbaseQueryRecords(tableId, [3], where, { top: 1 });
        return qbFieldValue(response.data?.[0], 3);
      }

      async function quickbaseUpsertRecord(tableId, whereClauses, fields) {
        const existingRecordId = await quickbaseFindRecordId(tableId, whereClauses);
        const row = {};
        if (existingRecordId) qbSetField(row, 3, Number(existingRecordId) || existingRecordId);
        (fields || []).forEach(field => qbSetField(row, field.fid, field.value));
        const response = await quickbaseWriteRecords(tableId, [row]);
        const savedRecordId = qbFieldValue(response.data?.[0], 3) || existingRecordId;
        return savedRecordId ? String(savedRecordId) : "";
      }

      async function syncDirectQuickbaseObjectRecords() {
        if (!hasDirectQuickbaseObjectStorage()) {
          throw new Error("Add the studio items table DBID and required FIDs before using direct Quickbase save.");
        }
        const storage = directQuickbaseStorage();
        const objectRecordIds = {};
        const objects = Object.values(state.catalog.objects || {});
        const existingRecordIds = await quickbaseFetchObjectRecordIdMap(storage);
        const rows = objects.map(object => {
          const row = {};
          const recordId = existingRecordIds.get(makeQuickbaseCompositeKey([object.id]));
          if (recordId) qbSetField(row, 3, Number(recordId) || recordId);
          qbSetTableField(row, storage.objectTableId, storage.objectKeyFieldId, object.id);
          qbSetTableField(row, storage.objectTableId, storage.objectTypeFieldId, object.type);
          qbSetTableField(row, storage.objectTableId, storage.objectNameFieldId, object.name);
          qbSetTableField(row, storage.objectTableId, storage.objectConfigFieldId, JSON.stringify(object));
          qbSetTableField(row, storage.objectTableId, storage.objectOwnerFieldId, object.ownerId || "");
          qbSetTableField(row, storage.objectTableId, storage.objectUpdatedAtFieldId, object.updatedAt || nowIso());
          qbSetTableField(row, storage.objectTableId, storage.objectUpdatedByFieldId, CURRENT_USER.id);
          return row;
        });
        const savedRows = await quickbaseWriteRecordBatches(storage.objectTableId, rows);
        objects.forEach((object, index) => {
          const recordId = qbFieldValue(savedRows[index], 3) || existingRecordIds.get(makeQuickbaseCompositeKey([object.id]));
          if (recordId) objectRecordIds[object.id] = String(recordId);
        });
        return objectRecordIds;
      }

      async function syncDirectQuickbaseStorageConfigRecord() {
        if (!hasDirectQuickbaseSettingsStorage()) return 0;
        const storage = directQuickbaseStorage();
        const storageConfig = normalizeQuickbaseStorageConfig(storage);
        if (!Object.keys(storageConfig).length) return 0;
        const existingRecordIds = await quickbaseFetchRecordIdMap(
          storage.userSettingsTableId,
          [storage.settingsUserFieldId, storage.settingsObjectKeyFieldId],
          {
            where: buildQuickbaseWhere([
              { fid: storage.settingsUserFieldId, value: CURRENT_USER.id }
            ])
          }
        );
        const row = {};
        const configKey = directStorageConfigRecordKey();
        const recordId = existingRecordIds.get(makeQuickbaseCompositeKey([CURRENT_USER.id, configKey]));
        if (recordId) qbSetField(row, 3, Number(recordId) || recordId);
        qbSetField(row, storage.settingsUserFieldId, CURRENT_USER.id);
        qbSetField(row, storage.settingsObjectFieldId, "");
        qbSetField(row, storage.settingsObjectKeyFieldId, configKey);
        qbSetField(row, storage.settingsJsonFieldId, JSON.stringify({
          type: "storageConfig",
          scope: quickbaseScopeKey(),
          apiBaseUrl: state.system.quickbase.apiBaseUrl,
          realmHostname: state.system.quickbase.realmHostname,
          appId: state.system.quickbase.appId,
          storage: storageConfig,
          updatedAt: nowIso(),
          updatedBy: CURRENT_USER.id
        }));
        qbSetField(row, storage.settingsUpdatedByFieldId, CURRENT_USER.id);
        await quickbaseWriteRecordBatches(storage.userSettingsTableId, [row], 1);
        return 1;
      }

      async function syncDirectQuickbasePreferenceRecords(objectRecordIds) {
        if (!hasDirectQuickbaseSettingsStorage()) return 0;
        const storage = directQuickbaseStorage();
        const existingRecordIds = await quickbaseFetchRecordIdMap(
          storage.userSettingsTableId,
          [storage.settingsUserFieldId, storage.settingsObjectKeyFieldId],
          {
            where: buildQuickbaseWhere([
              { fid: storage.settingsUserFieldId, value: CURRENT_USER.id }
            ])
          }
        );
        const rows = [];
        for (const [objectId, userBuckets] of Object.entries(state.preferences || {})) {
          const prefs = userBuckets && userBuckets[CURRENT_USER.id];
          if (!prefs) continue;
          const row = {};
          const recordId = existingRecordIds.get(makeQuickbaseCompositeKey([CURRENT_USER.id, objectId]));
          if (recordId) qbSetField(row, 3, Number(recordId) || recordId);
          qbSetField(row, storage.settingsUserFieldId, CURRENT_USER.id);
          qbSetField(row, storage.settingsObjectFieldId, objectRecordIds[objectId] ? Number(objectRecordIds[objectId]) : "");
          qbSetField(row, storage.settingsObjectKeyFieldId, objectId);
          qbSetField(row, storage.settingsJsonFieldId, JSON.stringify(prefs));
          qbSetField(row, storage.settingsUpdatedByFieldId, CURRENT_USER.id);
          rows.push(row);
        }
        if (!rows.length) return 0;
        await quickbaseWriteRecordBatches(storage.userSettingsTableId, rows);
        return rows.length;
      }

      async function loadDirectQuickbaseStorageConfigRecord() {
        if (!hasDirectQuickbaseSettingsStorage()) return null;
        const storage = directQuickbaseStorage();
        const where = buildQuickbaseWhere([
          { fid: storage.settingsUserFieldId, value: CURRENT_USER.id },
          { fid: storage.settingsObjectKeyFieldId, value: directStorageConfigRecordKey() }
        ]);
        const response = await quickbaseQueryRecords(storage.userSettingsTableId, [
          storage.settingsUserFieldId,
          storage.settingsObjectKeyFieldId,
          storage.settingsJsonFieldId
        ], where, { top: 1 });
        const row = response.data?.[0];
        if (!row) return null;
        const parsed = safeJsonParse(qbFieldValue(row, storage.settingsJsonFieldId));
        if (!parsed || typeof parsed !== "object") return null;
        const rawStorage = parsed.storage && typeof parsed.storage === "object" ? parsed.storage : parsed;
        return Object.assign({}, defaultSystemState().quickbase.storage, rawStorage);
      }

      async function syncDirectQuickbaseVersionRecords(objectRecordIds) {
        if (!hasDirectQuickbaseVersionStorage()) return 0;
        const storage = directQuickbaseStorage();
        const existingRecordIds = await quickbaseFetchRecordIdMap(storage.versionTableId, [
          storage.versionObjectKeyFieldId,
          storage.versionChangedAtFieldId
        ]);
        const rows = [];
        for (const [objectId, entries] of Object.entries(state.versions || {})) {
          for (const entry of entries || []) {
            const payload = {
              id: entry.id,
              message: entry.message || "Saved changes",
              changedAt: entry.changedAt || nowIso(),
              changedBy: entry.changedBy || CURRENT_USER.name,
              snapshot: entry.snapshot
            };
            const row = {};
            const recordId = existingRecordIds.get(makeQuickbaseCompositeKey([objectId, payload.changedAt]));
            if (recordId) qbSetField(row, 3, Number(recordId) || recordId);
            qbSetField(row, storage.versionObjectFieldId, objectRecordIds[objectId] ? Number(objectRecordIds[objectId]) : "");
            qbSetField(row, storage.versionObjectKeyFieldId, objectId);
            qbSetField(row, storage.versionSnapshotFieldId, JSON.stringify(payload));
            qbSetField(row, storage.versionChangedAtFieldId, payload.changedAt);
            qbSetField(row, storage.versionChangedByFieldId, payload.changedBy);
            qbSetField(row, storage.versionUpdatedByFieldId, CURRENT_USER.id);
            rows.push(row);
          }
        }
        if (!rows.length) return 0;
