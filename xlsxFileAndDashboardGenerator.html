      function runReport(report, runtimeFilters = {}) {
        if (!report) {
          return { rows: [], previewRows: [], warnings: ["Report is missing."], summary: [], chartData: [], totalRows: 0, sourceRows: 0 };
        }
        ensureReportViewConfig(report);
        const cacheKey = JSON.stringify([report.id || report.name, report.updatedAt, runtimeFilters]);
        if (state.sessions.resultCache[cacheKey]) return deepClone(state.sessions.resultCache[cacheKey]);
        const warnings = [];
        const table = resolveTable(report.source.tableId);
        if (!table) {
          return { rows: [], previewRows: [], warnings: ["Table is missing."], summary: [], chartData: [], totalRows: 0, sourceRows: 0 };
        }
        const fieldMap = Object.fromEntries(table.fields.map(field => [field.id, field]));
        const rows = deepClone(state.data[table.id] || []);
        const filters = [];
        (report.filters || []).forEach(filter => filters.push(filter));
        Object.keys(runtimeFilters || {}).forEach(fieldId => {
          const runtimeValue = runtimeFilters[fieldId];
          if (runtimeValue !== "" && runtimeValue !== undefined && runtimeValue !== null) {
            const field = fieldMap[fieldId];
            if (field) {
              filters.push({
                id: uid("rf"),
                fieldId,
                operator: field.type === "date" || field.type === "datetime" ? "preset" : "equals",
                value: runtimeValue
              });
            }
          }
        });
        const filtered = rows.filter(row => {
          return filters.every(filter => {
            const field = fieldMap[filter.fieldId];
            if (!field) {
              warnings.push("A filter field was skipped because it is missing.");
              return true;
            }
            return matchFilter(row[filter.fieldId], field, filter);
          });
        });
        let resultRows = filtered.slice();
        if ((report.groups || []).length) {
          const groupFields = report.groups.map(group => fieldMap[group.fieldId]).filter(Boolean);
          const bucket = new Map();
          filtered.forEach(row => {
            const key = groupFields.map(field => row[field.id]).join("|");
            if (!bucket.has(key)) {
              const seed = {};
              groupFields.forEach(field => {
                seed[field.id] = row[field.id];
              });
              seed.__rows = [];
              bucket.set(key, seed);
            }
            bucket.get(key).__rows.push(row);
          });
          resultRows = Array.from(bucket.values()).map(entry => {
            const children = entry.__rows;
            const summary = {};
            (report.summary?.metrics || [{ fieldId: report.selectedFields[0]?.fieldId, op: "count", label: "Count" }]).forEach(metric => {
              const metricField = fieldMap[metric.fieldId];
              const values = children.map(row => row[metric.fieldId]).filter(value => value !== null && value !== undefined && value !== "");
              let number = 0;
              if (metric.op === "count") number = children.length;
              if (metric.op === "countNonBlank") number = values.length;
              if (metric.op === "distinct") number = new Set(values.map(item => JSON.stringify(item))).size;
              if (metric.op === "sum") number = values.reduce((sum, item) => sum + Number(item || 0), 0);
              if (metric.op === "avg") number = values.length ? values.reduce((sum, item) => sum + Number(item || 0), 0) / values.length : 0;
              if (metric.op === "min") number = values.length ? Math.min(...values.map(item => Number(item || 0))) : 0;
              if (metric.op === "max") number = values.length ? Math.max(...values.map(item => Number(item || 0))) : 0;
              summary[metric.label || metricField?.label || metric.op] = number;
            });
            delete entry.__rows;
            return Object.assign({}, entry, summary);
          });
        }
        if ((report.sorts || []).length) {
          resultRows.sort((left, right) => {
            for (const sort of report.sorts) {
              const a = left[sort.fieldId];
              const b = right[sort.fieldId];
              if (a === b) continue;
              if (a === null || a === undefined || a === "") return 1;
              if (b === null || b === undefined || b === "") return -1;
              const direction = sort.direction === "desc" ? -1 : 1;
              return a > b ? direction : -direction;
            }
            return 0;
          });
        }
        const previewRows = resultRows.slice(0, 8);
        const response = {
          rows: resultRows,
          previewRows,
          warnings: Array.from(new Set(warnings)),
          summary: summarizeRows(filtered, report, fieldMap),
          chartData: chartDataForRows(filtered, report, fieldMap),
          totalRows: resultRows.length,
          sourceRows: filtered.length,
          fieldMap
        };
        state.sessions.resultCache[cacheKey] = deepClone(response);
        return response;
      }

      function dashboardRuntimeValues(dashboard, report) {
        const prefs = getPreferenceBucket(dashboard.id);
        const values = {};
        (dashboard.runtimeFilters || []).forEach(filter => {
          const applies = filter.mode === "global" || filter.targetReportIds.includes(report.id);
          if (!applies) return;
          const value = prefs.runtimeFilters[filter.id];
          if (value !== undefined && value !== null && value !== "") {
            values[filter.fieldId] = value;
          }
        });
        return values;
      }

      function scheduleActiveObjectLoading() {
        const object = getActiveObject();
        if (!object || object.type !== "dashboard") return;
        const tab = activeDashboardTab(object);
        if (!tab) return;
        if (!state.ui.widgetLoadState[object.id]) state.ui.widgetLoadState[object.id] = {};
        tab.widgets.forEach((widget, index) => {
          if (index === 0) {
            state.ui.widgetLoadState[object.id][widget.id] = true;
          } else {
            setTimeout(() => {
              if (!state.ui.widgetLoadState[object.id]) state.ui.widgetLoadState[object.id] = {};
              state.ui.widgetLoadState[object.id][widget.id] = true;
              render();
            }, 180 + index * 160);
          }
        });
      }

      function ensureTabPreference(dashboardId, tabId) {
        const prefs = getPreferenceBucket(dashboardId);
        prefs.preferredTabId = tabId;
        persistState();
      }

      function buildTableWorkbookSheet(report, result) {
        const table = resolveTable(report.source.tableId);
        if (!table) return { sheet: XLSX.utils.aoa_to_sheet([["Data source missing"]]), rows: 1 };
        const fieldMap = Object.fromEntries(table.fields.map(field => [field.id, field]));
        let columns = (report.groups || []).length
          ? Object.keys(result.rows[0] || {})
          : report.selectedFields.map(field => field.fieldId);
        if (!columns.length) columns = table.fields.slice(0, 4).map(field => field.id);
        const header = columns.map(fieldId => fieldMap[fieldId]?.label || fieldId);
        const aoa = [header];
        const chunkSize = 400;
        for (let start = 0; start < result.rows.length; start += chunkSize) {
          const slice = result.rows.slice(start, start + chunkSize);
          slice.forEach(row => {
            aoa.push(columns.map(fieldId => {
              const field = fieldMap[fieldId];
              return formatCellValue(field, row[fieldId]);
            }));
          });
        }
        const sheet = XLSX.utils.aoa_to_sheet(aoa);
        sheet["!cols"] = columns.map(() => ({ wch: 18 }));
        return { sheet, rows: result.rows.length };
      }

      function buildSummaryWorkbookSheet(report, result) {
        const aoa = [
          [report.name],
          [],
          ["Metric", "Value"]
        ];
        result.summary.forEach(item => aoa.push([item.label, item.value]));
        if (result.chartData.length) {
          aoa.push([]);
          aoa.push(["Breakdown", "Value"]);
          result.chartData.forEach(item => aoa.push([item.label, item.value]));
        }
        const sheet = XLSX.utils.aoa_to_sheet(aoa);
        sheet["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }];
        sheet["!cols"] = [{ wch: 28 }, { wch: 18 }];
        return { sheet, rows: result.summary.length + result.chartData.length };
      }

      function buildChartWorkbookSheets(report, result, baseName) {
        const total = result.chartData.reduce((sum, item) => sum + item.value, 0) || 1;
        const visualRows = result.chartData.map(item => {
          const share = item.value / total;
          const bars = "■".repeat(Math.max(1, Math.round(share * 18)));
          return [item.label, item.value, (share * 100).toFixed(1) + "%", bars];
        });
        const presentation = XLSX.utils.aoa_to_sheet([
          [report.name],
          ["Chart type", titleCase(report.view.chartType)],
          [],
          ["Category", "Value", "Share", "Visual"],
          ...visualRows
        ]);
        presentation["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];
        presentation["!cols"] = [{ wch: 28 }, { wch: 12 }, { wch: 12 }, { wch: 22 }];
        const data = XLSX.utils.aoa_to_sheet([
          ["Category", "Value"],
          ...result.chartData.map(item => [item.label, item.value])
        ]);
        data["!cols"] = [{ wch: 28 }, { wch: 12 }];
        return {
          rows: result.chartData.length,
          sheets: [
            { name: baseName, sheet: presentation },
            { name: cap(baseName + " Data", 31), sheet: data }
          ]
        };
      }

      function buildTimelineWorkbookSheet(report, result) {
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const startFieldId = report.view.timelineDateField;
        const endFieldId = report.view.timelineEndField;
        const titleFieldId = report.view.titleFieldId;
        const aoa = [[report.name], [], ["Start", "End", "Title"]];
        result.rows
          .filter(row => row[startFieldId])
          .sort((left, right) => new Date(left[startFieldId]) - new Date(right[startFieldId]))
          .forEach(row => {
            aoa.push([
              fmtDate(row[startFieldId]),
              endFieldId ? fmtDate(row[endFieldId]) : "",
              formatCellValue(fieldMap[titleFieldId], row[titleFieldId]) || "Untitled"
            ]);
          });
        const sheet = XLSX.utils.aoa_to_sheet(aoa);
        sheet["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 2 } }];
        sheet["!cols"] = [{ wch: 16 }, { wch: 16 }, { wch: 32 }];
        return { sheet, rows: Math.max(0, aoa.length - 3) };
      }

      function buildCalendarWorkbookSheet(report, result) {
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const dateFieldId = report.view.calendarDateField;
        const titleFieldId = report.view.titleFieldId;
        const datedRows = result.rows.filter(row => row[dateFieldId]).sort((left, right) => new Date(left[dateFieldId]) - new Date(right[dateFieldId]));
        const anchor = datedRows[0] ? new Date(datedRows[0][dateFieldId]) : new Date();
        const year = anchor.getFullYear();
        const month = anchor.getMonth();
        const firstDay = new Date(year, month, 1);
        const startWeekday = firstDay.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const itemsByDay = new Map();
        datedRows.forEach(row => {
          const day = new Date(row[dateFieldId]).getDate();
          if (!itemsByDay.has(day)) itemsByDay.set(day, []);
          itemsByDay.get(day).push(formatCellValue(fieldMap[titleFieldId], row[titleFieldId]) || "Untitled");
        });
        const aoa = [[report.name], [], ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]];
        let day = 1;
        for (let week = 0; week < 6 && day <= daysInMonth; week += 1) {
          const row = [];
          for (let dow = 0; dow < 7; dow += 1) {
            if ((week === 0 && dow < startWeekday) || day > daysInMonth) {
              row.push("");
            } else {
              const items = (itemsByDay.get(day) || []).slice(0, 2).join(" | ");
              row.push(day + (items ? " " + items : ""));
              day += 1;
            }
          }
          aoa.push(row);
        }
        const sheet = XLSX.utils.aoa_to_sheet(aoa);
        sheet["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
        sheet["!cols"] = new Array(7).fill(null).map(() => ({ wch: 18 }));
        return { sheet, rows: datedRows.length };
      }

      function buildKanbanWorkbookSheet(report, result) {
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const laneFieldId = report.view.kanbanField;
        const titleFieldId = report.view.titleFieldId;
        const lanes = new Map();
        result.rows.forEach(row => {
          const lane = Array.isArray(row[laneFieldId]) ? row[laneFieldId].join(", ") : String(row[laneFieldId] || "Unassigned");
          if (!lanes.has(lane)) lanes.set(lane, []);
          lanes.get(lane).push(formatCellValue(fieldMap[titleFieldId], row[titleFieldId]) || "Untitled");
        });
        const laneNames = Array.from(lanes.keys()).slice(0, 6);
        const maxCards = Math.max(1, ...laneNames.map(name => lanes.get(name).length));
        const aoa = [[report.name], [], laneNames];
        for (let index = 0; index < maxCards; index += 1) {
          aoa.push(laneNames.map(name => lanes.get(name)[index] || ""));
        }
        const sheet = XLSX.utils.aoa_to_sheet(aoa);
        sheet["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: Math.max(0, laneNames.length - 1) } }];
        sheet["!cols"] = laneNames.map(() => ({ wch: 24 }));
        return { sheet, rows: result.rows.length };
      }

      function buildWorkbookSheet(report, runtimeFilters, baseName) {
        const result = runReport(report, runtimeFilters);
        if (report.view.mode === "summary") {
          const built = buildSummaryWorkbookSheet(report, result);
          return { rows: built.rows, sheets: [{ name: baseName, sheet: built.sheet }] };
        }
        if (report.view.mode === "chart") {
          return buildChartWorkbookSheets(report, result, baseName);
        }
        if (report.view.mode === "timeline") {
          const built = buildTimelineWorkbookSheet(report, result);
          return { rows: built.rows, sheets: [{ name: baseName, sheet: built.sheet }] };
        }
        if (report.view.mode === "calendar") {
          const built = buildCalendarWorkbookSheet(report, result);
          return { rows: built.rows, sheets: [{ name: baseName, sheet: built.sheet }] };
        }
        if (report.view.mode === "kanban") {
          const built = buildKanbanWorkbookSheet(report, result);
          return { rows: built.rows, sheets: [{ name: baseName, sheet: built.sheet }] };
        }
        const built = buildTableWorkbookSheet(report, result);
        return { rows: built.rows, sheets: [{ name: baseName, sheet: built.sheet }] };
      }

      function uniqueSheetName(workbook, baseName) {
        const used = new Set(workbook.SheetNames || []);
        let name = cap(baseName, 31) || "Sheet";
        if (!used.has(name)) return name;
        let index = 2;
        while (used.has(cap(name.slice(0, 27) + " " + index, 31))) {
          index += 1;
        }
        return cap(name.slice(0, 27) + " " + index, 31);
      }

      function escapeSvgText(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function polarToCartesian(cx, cy, radius, angleDeg) {
        const angle = ((angleDeg - 90) * Math.PI) / 180;
        return {
          x: cx + (radius * Math.cos(angle)),
          y: cy + (radius * Math.sin(angle))
        };
      }

      function describeArc(cx, cy, radius, startAngle, endAngle) {
        const start = polarToCartesian(cx, cy, radius, endAngle);
        const end = polarToCartesian(cx, cy, radius, startAngle);
        const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
        return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} 0 ${end.x} ${end.y}`;
      }

      function buildChartPreviewSvg(report, chartData) {
        const width = 920;
        const height = 420;
        const chartType = report?.view?.chartType || "bar";
        if (!chartData.length) {
          return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
              <rect width="100%" height="100%" fill="#ffffff"/>
              <text x="40" y="70" font-size="28" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">No chart data</text>
            </svg>
          `;
        }
        const legend = chartData.map((item, index) => `
          <g transform="translate(${40 + ((index % 3) * 280)}, ${350 + (Math.floor(index / 3) * 28)})">
            <rect width="14" height="14" rx="4" fill="${item.color}"/>
            <text x="22" y="12" font-size="14" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(cap(item.label, 28))} · ${item.value}</text>
          </g>
        `).join("");
        if (chartType === "line" || chartType === "area") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          const points = chartData.map((item, index) => {
            const x = chartData.length === 1 ? 460 : 70 + (index * (740 / Math.max(1, chartData.length - 1)));
            const y = 280 - ((item.value / max) * 180);
            return { x, y, item };
          });
          const polyline = points.map(point => `${point.x},${point.y}`).join(" ");
          const areaPoints = `70,280 ${polyline} 810,280`;
          return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
              <rect width="100%" height="100%" fill="#ffffff"/>
              <text x="40" y="44" font-size="30" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">${escapeSvgText(report.name || "Chart")}</text>
              <text x="40" y="72" font-size="15" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(titleCase(chartType))} preview</text>
              <line x1="70" y1="280" x2="810" y2="280" stroke="rgba(23,49,38,0.18)" stroke-width="2"/>
              <line x1="70" y1="100" x2="70" y2="280" stroke="rgba(23,49,38,0.12)" stroke-width="2"/>
              ${chartType === "area" ? `<polygon points="${areaPoints}" fill="rgba(13,124,102,0.16)"/>` : ""}
              <polyline points="${polyline}" fill="none" stroke="#0d7c66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              ${points.map(point => `<circle cx="${point.x}" cy="${point.y}" r="6" fill="${point.item.color}" stroke="#ffffff" stroke-width="3"/>`).join("")}
              ${points.map(point => `<text x="${point.x}" y="${Math.min(96, point.y - 12)}" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="#173126">${point.item.value}</text>`).join("")}
              ${legend}
            </svg>
          `;
        }
        if (chartType === "donut" || chartType === "pie") {
          const total = chartData.reduce((sum, item) => sum + item.value, 0) || 1;
          const radius = 92;
          const stroke = chartType === "donut" ? 48 : 184;
          let angle = 0;
          const arcs = chartData.map(item => {
            const span = (item.value / total) * 360;
            const path = describeArc(240, 195, radius, angle, angle + span);
            angle += span;
            return `<path d="${path}" fill="none" stroke="${item.color}" stroke-width="${stroke}" stroke-linecap="butt"/>`;
          }).join("");
          return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
              <rect width="100%" height="100%" fill="#ffffff"/>
              <text x="40" y="44" font-size="30" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">${escapeSvgText(report.name || "Chart")}</text>
              <text x="40" y="72" font-size="15" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(titleCase(chartType))} preview</text>
              <g transform="translate(0 0)">
                ${arcs}
                ${chartType === "donut" ? `
                  <circle cx="240" cy="195" r="58" fill="#ffffff"/>
                  <text x="240" y="188" text-anchor="middle" font-size="14" font-family="Manrope, Segoe UI, sans-serif" fill="#718276">Rows</text>
                  <text x="240" y="214" text-anchor="middle" font-size="34" font-family="IBM Plex Mono, monospace" fill="#173126">${total}</text>
                ` : ""}
              </g>
              ${legend}
            </svg>
          `;
        }
        if (chartType === "column" || chartType === "stacked-column") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          const barWidth = Math.min(88, Math.floor(620 / chartData.length));
          return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
              <rect width="100%" height="100%" fill="#ffffff"/>
              <text x="40" y="44" font-size="30" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">${escapeSvgText(report.name || "Chart")}</text>
              <text x="40" y="72" font-size="15" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(titleCase(chartType))} preview</text>
              <line x1="70" y1="280" x2="810" y2="280" stroke="rgba(23,49,38,0.18)" stroke-width="2"/>
              ${chartData.map((item, index) => {
                const x = 90 + (index * (Math.max(barWidth + 22, 740 / chartData.length)));
                const barHeight = Math.max(26, (item.value / max) * 170);
                return `
                  <g>
                    <rect x="${x}" y="${280 - barHeight}" width="${barWidth}" height="${barHeight}" rx="16" fill="${item.color}"/>
                    <text x="${x + (barWidth / 2)}" y="${266 - barHeight}" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="#173126">${item.value}</text>
                    <text x="${x + (barWidth / 2)}" y="306" text-anchor="middle" font-size="12" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(cap(item.label, 14))}</text>
                  </g>
                `;
              }).join("")}
              ${legend}
            </svg>
          `;
        }
        if (chartType === "funnel") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
              <rect width="100%" height="100%" fill="#ffffff"/>
              <text x="40" y="44" font-size="30" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">${escapeSvgText(report.name || "Chart")}</text>
              <text x="40" y="72" font-size="15" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(titleCase(chartType))} preview</text>
              ${chartData.map((item, index) => {
                const stepWidth = Math.max(160, (item.value / max) * 520);
                const x = 460 - (stepWidth / 2);
                const y = 100 + (index * 42);
                return `
                  <g>
                    <rect x="${x}" y="${y}" width="${stepWidth}" height="28" rx="14" fill="${item.color}"/>
                    <text x="460" y="${y + 19}" text-anchor="middle" font-size="13" font-family="Manrope, Segoe UI, sans-serif" fill="#ffffff">${escapeSvgText(item.label)} · ${item.value}</text>
                  </g>
                `;
              }).join("")}
              ${legend}
            </svg>
          `;
        }
        if (chartType === "heatmap") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
              <rect width="100%" height="100%" fill="#ffffff"/>
              <text x="40" y="44" font-size="30" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">${escapeSvgText(report.name || "Chart")}</text>
              <text x="40" y="72" font-size="15" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(titleCase(chartType))} preview</text>
              ${chartData.map((item, index) => {
                const col = index % 3;
                const row = Math.floor(index / 3);
                const x = 80 + (col * 220);
                const y = 110 + (row * 90);
                const opacity = 0.22 + ((item.value / max) * 0.68);
                return `
                  <g>
                    <rect x="${x}" y="${y}" width="180" height="64" rx="20" fill="rgba(13,124,102,${opacity})"/>
                    <text x="${x + 16}" y="${y + 26}" font-size="12" font-family="Manrope, Segoe UI, sans-serif" fill="#ffffff">${escapeSvgText(cap(item.label, 20))}</text>
                    <text x="${x + 16}" y="${y + 50}" font-size="24" font-family="IBM Plex Mono, monospace" fill="#ffffff">${item.value}</text>
                  </g>
                `;
              }).join("")}
              ${legend}
            </svg>
          `;
        }
        const max = Math.max(...chartData.map(item => item.value), 1);
        return `
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <rect width="100%" height="100%" fill="#ffffff"/>
            <text x="40" y="44" font-size="30" font-family="Manrope, Segoe UI, sans-serif" fill="#173126">${escapeSvgText(report.name || "Chart")}</text>
            <text x="40" y="72" font-size="15" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(titleCase(chartType))} preview</text>
            ${chartData.map((item, index) => {
              const y = 104 + (index * 34);
              const barWidth = Math.max(24, (item.value / max) * 540);
              return `
                <g>
                  <text x="70" y="${y + 14}" font-size="13" font-family="Manrope, Segoe UI, sans-serif" fill="#506257">${escapeSvgText(cap(item.label, 22))}</text>
                  <rect x="250" y="${y}" width="540" height="18" rx="9" fill="rgba(13,124,102,0.10)"/>
                  <rect x="250" y="${y}" width="${barWidth}" height="18" rx="9" fill="${item.color}"/>
                  <text x="${800}" y="${y + 14}" text-anchor="end" font-size="12" font-family="IBM Plex Mono, monospace" fill="#173126">${item.value}</text>
                </g>
              `;
            }).join("")}
            ${legend}
          </svg>
        `;
      }

      function svgToPngDataUrl(svg, width = 920, height = 420) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, width, height);
            context.drawImage(img, 0, 0, width, height);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL("image/png"));
          };
          img.onerror = error => {
            URL.revokeObjectURL(url);
            reject(error);
          };
          img.src = url;
        });
      }

      async function injectChartPreviewsIntoWorkbook(buffer, chartSheets) {
        if (!window.ExcelJS || !chartSheets.length) return buffer;
        const workbook = new window.ExcelJS.Workbook();
        await workbook.xlsx.load(buffer);
        for (const chartSheet of chartSheets) {
          const worksheet = workbook.getWorksheet(chartSheet.sheetName);
          if (!worksheet || !chartSheet.chartData?.length) continue;
          const svg = buildChartPreviewSvg(chartSheet.report, chartSheet.chartData);
          const dataUrl = await svgToPngDataUrl(svg);
          const imageId = workbook.addImage({
            base64: dataUrl,
            extension: "png"
          });
          worksheet.getCell("F1").value = "Chart Preview";
          worksheet.getCell("F1").font = { bold: true, size: 12 };
          worksheet.addImage(imageId, {
            tl: { col: 5, row: 1 },
            ext: { width: 520, height: 238 }
          });
        }
        return workbook.xlsx.writeBuffer();
      }

      function downloadWorkbookBuffer(buffer, filename) {
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function runExportJob(jobId) {
        const job = state.exportJobs.find(item => item.id === jobId);
        const dashboard = state.catalog.objects[job.objectId];
        if (!job || !dashboard || dashboard.type !== "dashboard") return;
        job.status = "running";
        job.progress = 0;
        job.message = "Preparing workbook";
        render();
        try {
          const handledRemotely = await tryRemoteExport(job, dashboard);
          if (handledRemotely) return;
          if (!window.XLSX) throw new Error("XLSX library is not available.");
          const workbook = XLSX.utils.book_new();
          const chartSheets = [];
          const widgets = dashboard.tabs.flatMap(tab => tab.widgets.map(widget => ({ tab, widget })));
          let rowEstimate = 0;
          let addedChartNotice = false;
          for (const entry of widgets) {
            const report = resolveWidgetReport(entry.widget);
            if (!report) continue;
            await ensureTablePreviewData(report.source.tableId, collectDashboardReportFieldIds(dashboard, report));
            const runtimeFilters = dashboardRuntimeValues(dashboard, report);
            const result = runReport(report, runtimeFilters);
            rowEstimate += result.rows.length;
          }
          if (rowEstimate > HARD_EXPORT_LIMIT) {
            throw new Error("Export is too large for a single workbook. Narrow the date range or split the dashboard.");
          }
          for (let index = 0; index < widgets.length; index += 1) {
            const entry = widgets[index];
            const report = resolveWidgetReport(entry.widget);
            const runtimeFilters = report ? dashboardRuntimeValues(dashboard, report) : {};
            job.message = "Building " + entry.tab.name + " / " + entry.widget.title;
            const sheetName = uniqueSheetName(workbook, entry.tab.name + " " + entry.widget.title);
            if (!report) {
              XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet([["Missing report"]]), sheetName);
            } else {
              if (report.view?.mode === "chart" && !addedChartNotice) {
                const notice = XLSX.utils.aoa_to_sheet([
                  ["Export notes"],
                  [],
                  ["Chart widgets are exported here as presentation sheets plus chart-ready aggregate data."],
                  ["This workbook now includes embedded chart preview images on chart sheets."]
                ]);
                notice["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 2 } }];
                notice["!cols"] = [{ wch: 32 }, { wch: 24 }, { wch: 24 }];
                XLSX.utils.book_append_sheet(workbook, notice, uniqueSheetName(workbook, "Export Notes"));
                addedChartNotice = true;
              }
              if (report.view?.mode === "chart") {
                const chartResult = runReport(report, runtimeFilters);
                chartSheets.push({
                  sheetName,
                  report: deepClone(report),
                  chartData: chartResult.chartData
                });
              }
              const built = buildWorkbookSheet(report, runtimeFilters, sheetName);
              built.sheets.forEach(entrySheet => {
                XLSX.utils.book_append_sheet(workbook, entrySheet.sheet, uniqueSheetName(workbook, entrySheet.name));
              });
            }
            job.progress = Math.round(((index + 1) / widgets.length) * 100);
            render();
            await nextTick();
          }
          job.message = chartSheets.length ? "Rendering chart previews" : (rowEstimate > SOFT_EXPORT_LIMIT ? "Compressing workbook" : "Saving workbook");
          render();
          await nextTick();
          let workbookBuffer = XLSX.write(workbook, { type: "array", bookType: "xlsx", compression: true });
          if (chartSheets.length) {
            workbookBuffer = await injectChartPreviewsIntoWorkbook(workbookBuffer, chartSheets);
          }
          job.message = rowEstimate > SOFT_EXPORT_LIMIT ? "Compressing workbook" : "Saving workbook";
          render();
          await nextTick();
          downloadWorkbookBuffer(workbookBuffer, dashboard.name.replace(/\s+/g, "_") + ".xlsx");
          job.status = "done";
          job.message = "Workbook downloaded";
          job.finishedAt = nowIso();
          render();
          persistState();
        } catch (error) {
          console.error(error);
          job.status = "failed";
          job.message = error.message || "Export failed.";
          job.finishedAt = nowIso();
          render();
          persistState();
        }
      }

      function queueExport() {
        const object = getActiveObject();
        if (!object || object.type !== "dashboard") {
          pushToast("Open a dashboard to export it.", "warn");
          return;
        }
        if (!hasPermission(object, "export")) {
          pushToast("You do not have export access for this dashboard.", "danger");
          return;
        }
        const widgets = object.tabs.flatMap(tab => tab.widgets.map(widget => ({ tab, widget })));
        let rowEstimate = 0;
        widgets.forEach(entry => {
          const report = resolveWidgetReport(entry.widget);
          if (!report) return;
          rowEstimate += runReport(report, dashboardRuntimeValues(object, report)).rows.length;
        });
        const job = {
          id: uid("job"),
          objectId: object.id,
          createdAt: nowIso(),
          createdBy: CURRENT_USER.name,
          status: "queued",
          progress: 0,
          message: rowEstimate > SOFT_EXPORT_LIMIT
            ? "Large export queued. Compression and staged writing will be used."
            : "Queued",
          estimate: rowEstimate
        };
        state.exportJobs.unshift(job);
        state.ui.drawer = "export";
        render();
        persistState();
        setTimeout(() => runExportJob(job.id), 60);
      }

      function handleUploadFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const parsed = parseCsv(String(reader.result || ""));
          const template = state.templates.upload[0];
          const tableId = template?.tableId || state.metadata.tables[0].id;
          const table = resolveTable(tableId);
          const columnMap = {};
          parsed.headers.forEach(header => {
            const match = table.fields.find(field => field.label.toLowerCase() === header.toLowerCase() || field.id.toLowerCase() === header.toLowerCase());
            if (match) columnMap[header] = match.id;
            else if (template?.columnMap?.[header]) columnMap[header] = template.columnMap[header];
          });
          state.ui.uploadSession = {
            fileName: file.name,
            tableId,
            headers: parsed.headers,
            sampleRows: parsed.records.slice(0, 5),
            columnMap
          };
          render();
        };
        reader.readAsText(file);
      }

        const targetIndex = currentIndex + delta;
        if (currentIndex < 0 || targetIndex < 0 || targetIndex >= list.length) return list;
        const updated = list.slice();
        const [item] = updated.splice(currentIndex, 1);
        updated.splice(targetIndex, 0, item);

        draft.selectedFieldIds = selected;
        draft.chartFieldId = fieldExists(table, draft.chartFieldId) && isChartField(resolveField(table.id, draft.chartFieldId)) ? draft.chartFieldId : "";
        draft.timelineDateField = fieldExists(table, draft.timelineDateField) && isDateField(resolveField(table.id, draft.timelineDateField)) ? draft.timelineDateField : "";
        draft.timelineEndField = fieldExists(table, draft.timelineEndField) && isDateField(resolveField(table.id, draft.timelineEndField)) ? draft.timelineEndField : "";
        draft.calendarDateField = fieldExists(table, draft.calendarDateField) && isDateField(resolveField(table.id, draft.calendarDateField)) ? draft.calendarDateField : "";
        draft.kanbanField = fieldExists(table, draft.kanbanField) && isGroupingField(resolveField(table.id, draft.kanbanField)) ? draft.kanbanField : "";
        draft.titleFieldId = fieldExists(table, draft.titleFieldId) && isTitleField(resolveField(table.id, draft.titleFieldId)) ? draft.titleFieldId : "";

        if (!table) return;
        const draft = state.ui.createDraft;
        const fieldMap = new Map(table.fields.map(field => [field.id, field]));
        const selected = (draft.selectedFieldIds || []).filter(fieldId => fieldMap.has(fieldId));
        draft.tableId = tableId;
        draft.selectedFieldIds = selected;
        draft.chartFieldId = fieldExists(table, draft.chartFieldId) && isChartField(resolveField(table.id, draft.chartFieldId)) ? draft.chartFieldId : "";
        draft.timelineDateField = fieldExists(table, draft.timelineDateField) && isDateField(resolveField(table.id, draft.timelineDateField)) ? draft.timelineDateField : "";
        draft.timelineEndField = fieldExists(table, draft.timelineEndField) && isDateField(resolveField(table.id, draft.timelineEndField)) ? draft.timelineEndField : "";
        draft.calendarDateField = fieldExists(table, draft.calendarDateField) && isDateField(resolveField(table.id, draft.calendarDateField)) ? draft.calendarDateField : "";
        draft.kanbanField = fieldExists(table, draft.kanbanField) && isGroupingField(resolveField(table.id, draft.kanbanField)) ? draft.kanbanField : "";
        draft.titleFieldId = fieldExists(table, draft.titleFieldId) && isTitleField(resolveField(table.id, draft.titleFieldId)) ? draft.titleFieldId : "";
        normalizeDraftFiltersAndSorts(draft, tableId);
      }

      function toggleAddWidgetField(fieldId) {
        const draft = state.ui.addWidgetDraft;
        const selected = Array.isArray(draft.selectedFieldIds) ? draft.selectedFieldIds.slice() : [];
        const index = selected.indexOf(fieldId);
        if (index >= 0) {
          selected.splice(index, 1);
        } else {
          selected.push(fieldId);
        }
        draft.selectedFieldIds = selected;
        syncAddWidgetDraftForTable(draft.tableId);
      }

      function toggleCreateDraftField(fieldId) {
        const draft = state.ui.createDraft;
        const selected = Array.isArray(draft.selectedFieldIds) ? draft.selectedFieldIds.slice() : [];
        const index = selected.indexOf(fieldId);
        if (index >= 0) {
          selected.splice(index, 1);
        } else {
          selected.push(fieldId);
        }
        draft.selectedFieldIds = selected;
        syncCreateDraftForTable(draft.tableId);
      }

      function moveDraftSelectedField(draftKey, fieldId, delta) {
        const draft = state.ui[draftKey];
        if (!draft) return;
        const selected = Array.isArray(draft.selectedFieldIds) ? draft.selectedFieldIds.slice() : [];
        const index = selected.indexOf(fieldId);
        draft.selectedFieldIds = moveItemByIndex(selected, index, delta);
        if (draftKey === "createDraft") {
          syncCreateDraftForTable(draft.tableId);
        } else if (draftKey === "addWidgetDraft") {
          syncAddWidgetDraftForTable(draft.tableId);
        }
      }

      function moveSelectedField(itemId, delta) {
        const object = getActiveObject();
        if (!object || object.type !== "report") return;
        commitMutation("Reordered fields", () => {
          const index = object.selectedFields.findIndex(item => item.id === itemId);
          object.selectedFields = moveItemByIndex(object.selectedFields, index, delta);
        });
      }

      function addWidgetFromDraft() {
        const dashboard = getActiveObject();
        if (!dashboard || dashboard.type !== "dashboard") return;
        const draft = state.ui.addWidgetDraft;
        const tab = dashboard.tabs.find(item => item.id === draft.tabId) || activeDashboardTab(dashboard);
        let report = null;
        if (!tab) {
          pushToast("Pick a tab first.", "warn");
          return;
        }
        if (draft.source === "existing") {
          report = state.catalog.objects[draft.reportId];
          if (!report) {
            pushToast("Pick a report first.", "warn");
            return;
          }
        } else {
          const table = resolveTable(draft.tableId);
          const selectedFieldIds = (draft.selectedFieldIds || []).filter(Boolean);
          if (!table) {
            pushToast("Choose the source table first.", "warn");
            return;
          }
          if (!selectedFieldIds.length) {
            pushToast("Pick at least one field for the new report.", "warn");
            return;
          }
          report = createReport(draft.name.trim() || (table.name + " report"), table.id, selectedFieldIds);
          applyDraftViewToReport(report, draft, table);
          applyDraftQueryToReport(report, draft);
        }
        commitMutation("Added widget", () => {
          if (draft.source === "new") {
            state.catalog.objects[report.id] = report;
            state.catalog.order.unshift(report.id);
          }
          tab.widgets.push(createWidget(report, draft.mode));
          state.ui.modal = null;
          state.ui.selectedWidgetId = tab.widgets[tab.widgets.length - 1].id;
        });
        if (draft.source === "new") {
          ensureTablePreviewData(report.source.tableId, collectReportFieldIds(report));
        }
        syncStateToProviderIfQuickbase(draft.source === "new" ? "add-widget-create-report" : "add-widget");
      }

      function resetRuntimeFilters(mode) {
        const dashboard = getActiveObject();
        if (!dashboard || dashboard.type !== "dashboard") return;
        commitMutation("Reset filters", () => {
          const prefs = getPreferenceBucket(dashboard.id);
          if (mode === "clear") {
            prefs.runtimeFilters = {};
          } else {
            const next = {};
            dashboard.runtimeFilters.forEach(filter => {
              next[filter.id] = filter.defaultValue || "";
            });
            prefs.runtimeFilters = next;
          }
        }, { recordHistory: false });
      }

      function captureRenderFocusState() {
        const active = document.activeElement;
        if (!active || !appNode || !appNode.contains(active)) return null;
        if (!active.matches("input, textarea, select")) return null;
        if (!active.dataset || !active.dataset.action) return null;
        return {
          tagName: active.tagName,
          action: active.dataset.action,
          dataset: Object.assign({}, active.dataset),
          selectionStart: typeof active.selectionStart === "number" ? active.selectionStart : null,
          selectionEnd: typeof active.selectionEnd === "number" ? active.selectionEnd : null
        };
      }

      function captureRenderScrollState() {
        if (!appNode) return [];
        return Array.from(appNode.querySelectorAll("[data-scroll-key]"))
          .map(node => ({
            key: node.dataset.scrollKey,
            top: node.scrollTop,
            left: node.scrollLeft
          }))
          .filter(entry => entry.key);
      }

      function restoreRenderFocusState() {
        if (!renderFocusState || !appNode) return;
        const focusState = renderFocusState;
        const candidates = Array.from(appNode.querySelectorAll(`[data-action="${focusState.action}"]`));
        const match = candidates.find(node => {
          return Object.entries(focusState.dataset).every(([key, value]) => String(node.dataset[key] || "") === String(value));
        });
        renderFocusState = null;
        if (!match) return;
        match.focus({ preventScroll: true });
        if ((match.tagName === "INPUT" || match.tagName === "TEXTAREA")
          && typeof focusState.selectionStart === "number"
          && typeof match.setSelectionRange === "function") {
          match.setSelectionRange(focusState.selectionStart, focusState.selectionEnd ?? focusState.selectionStart);
        }
      }

      function restoreRenderScrollState() {
        if (!renderScrollState || !appNode) return;
        const scrollState = renderScrollState;
        renderScrollState = null;
        scrollState.forEach(entry => {
          const node = appNode.querySelector(`[data-scroll-key="${entry.key}"]`);
          if (!node) return;
          node.scrollTop = entry.top || 0;
          node.scrollLeft = entry.left || 0;
        });
      }

      function render() {
        if (!appNode) return;
        renderFocusState = captureRenderFocusState();
        renderScrollState = captureRenderScrollState();
        const object = getActiveObject();
        const validation = getValidation(object);
        const routeContext = getHostedRouteContext();
        appNode.innerHTML = `
          <div class="app-shell ${routeContext.embed ? "embed-shell" : ""}">

              </aside>

            </div>

          ${routeContext.embed ? "" : renderDrawer(object)}
          ${routeContext.embed ? "" : renderModal()}

        syncRouteFromState();
        restoreRenderScrollState();
        restoreRenderFocusState();
      }

              ${builderActionsVisible ? `

      function renderLibrary() {
        const objects = state.catalog.order
          .map(id => state.catalog.objects[id])
          .filter(Boolean)

            if (state.ui.libraryType !== "all" && object.type !== state.ui.libraryType) return false;
            if (state.ui.libraryOwner === "mine" && object.ownerId !== CURRENT_USER.id) return false;
            if (state.ui.libraryFavoritesOnly && !isFavorite(object)) return false;
            if (state.ui.libraryRecentOnly && !state.catalog.recent.includes(object.id)) return false;
            const haystack = [
              object.name,
              object.description,
              object.folder,
              object.category,
              ...(object.tags || [])

        const recentIds = new Set(state.catalog.recent);
        return `

            <div class="pill-row">

            <div class="stack">
              ${objects.map(object => `
                <button class="library-card ${state.ui.activeObjectId === object.id ? "active" : ""}" data-action="select-object" data-object-id="${object.id}">
                  <div class="card-head">
                    <div class="library-name">${escapeHtml(object.name)}</div>

          <div class="section">

              <button class="mini-button" data-action="save-template">Save current</button>
            </div>

              </div>

      function renderRuntimeFilter(dashboard, filter, prefs) {
        const field = resolveField(resolveDashboardDefaultTable(dashboard), filter.fieldId) || state.metadata.tables.flatMap(table => table.fields).find(item => item.id === filter.fieldId);
        const value = prefs.runtimeFilters[filter.id] ?? filter.defaultValue ?? "";
        if (!field) {
          return `
            <div class="runtime-filter">
              <label>${escapeHtml(filter.label)}</label>
              <div class="hint">Field is missing. Update this filter in Build mode.</div>
            </div>
          `;
        }
        const options = field.options || [];
        if (field.type === "date" || field.type === "datetime") {
          return `
            <div class="runtime-filter">
              <label>${escapeHtml(filter.label)}</label>
              <select data-action="runtime-filter" data-filter-id="${filter.id}">
                ${["", "CURRENT_MONTH", "LAST_30_DAYS", "CURRENT_YEAR"].map(item => `
                  <option value="${item}" ${String(value) === item ? "selected" : ""}>
                    ${item ? titleCase(item) : "None"}
                  </option>
                `).join("")}
              </select>
            </div>
          `;
        }
        if (options.length) {
          return `
            <div class="runtime-filter">
              <label>${escapeHtml(filter.label)}</label>
              <select data-action="runtime-filter" data-filter-id="${filter.id}">
                <option value="">All</option>
                ${options.map(option => `<option value="${escapeHtml(option)}" ${String(value) === option ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
              </select>
            </div>
          `;
        }
        return `
          <div class="runtime-filter">
            <label>${escapeHtml(filter.label)}</label>
            <input type="${["number", "currency", "summary", "formula-number"].includes(field.type) ? "number" : "text"}" value="${escapeHtml(value)}" data-action="runtime-filter" data-filter-id="${filter.id}">
          </div>
        `;
      }

      function renderWidget(widget, dashboard, isLoaded) {
        const report = resolveWidgetReport(widget);
        if (report) ensureReportViewConfig(report);
        const runtimeFilters = report ? dashboardRuntimeValues(dashboard, report) : {};
        const result = report && isLoaded ? runReport(report, runtimeFilters) : null;
        const showMetricHeader = report?.view?.mode !== "summary";
        return `
          <div class="widget-head">
            <div>
              <div class="widget-title">${escapeHtml(widget.title)}</div>
              <div class="micro">${report ? escapeHtml(report.name) : "Missing report"} · ${widget.reportRef.mode === "linked" ? "Linked" : "Copied"}</div>
            </div>
            <div class="widget-actions ${state.ui.mode === "viewer" ? "hidden" : ""}">
              <button class="mini-button" data-action="resize-widget" data-widget-id="${widget.id}" data-dw="1" data-dh="0">W+</button>
              <button class="mini-button" data-action="resize-widget" data-widget-id="${widget.id}" data-dw="-1" data-dh="0">W-</button>
              <button class="mini-button" data-action="resize-widget" data-widget-id="${widget.id}" data-dw="0" data-dh="1">H+</button>
              <button class="mini-button" data-action="duplicate-widget" data-widget-id="${widget.id}">Duplicate</button>
              <button class="mini-button danger" data-action="delete-widget" data-widget-id="${widget.id}">Remove</button>
            </div>
          </div>
          <div class="widget-body">
            ${!report ? `
              <div class="empty-state">
                <strong>Report missing</strong>
                <div class="hint">Repair the widget by linking it to a valid report.</div>
              </div>
            ` : !isLoaded ? `
              <div class="skeleton"></div>
            ` : result.totalRows === 0 ? `
              <div class="empty-state">
                <strong>No results</strong>
                <div class="hint">Try a broader date range or clear a filter.</div>
              </div>
            ` : `
              ${showMetricHeader ? `
                <div class="summary-row">
                  ${result.summary.map(item => `
                    <div class="summary-chip">
                      <strong>${escapeHtml(item.value)}</strong>
                      <span>${escapeHtml(item.label)}</span>
                    </div>
                  `).join("")}
                </div>
              ` : ""}
              ${renderReportDisplay(report, result)}
              ${result.warnings.length ? `<div class="hint">${escapeHtml(result.warnings[0])}</div>` : ""}
            `}
          </div>
        `;
      }

      function renderReportDisplay(report, result) {
        ensureReportViewConfig(report);
        if (report.view.mode === "summary") return renderSummaryReport(report, result);
        if (report.view.mode === "chart") return renderChart(report, result.chartData);
        if (report.view.mode === "timeline") return renderTimelineReport(report, result);
        if (report.view.mode === "calendar") return renderCalendarReport(report, result);
        if (report.view.mode === "kanban") return renderKanbanReport(report, result);
        return renderMiniTable(report, result);
      }

      function renderChart(report, chartData) {
        ensureReportViewConfig(report);
        if (!chartData.length) {
          return `
            <div class="empty-state">
              <strong>Preview unavailable</strong>
              <div class="hint">Pick a chart field with results to show the preview.</div>
            </div>
          `;
        }
        if (report.view.chartType === "donut" || report.view.chartType === "pie") {
          const total = chartData.reduce((sum, item) => sum + item.value, 0);
          let offset = 0;
          const stops = chartData.map(item => {
            const start = total ? (offset / total) * 360 : 0;
            offset += item.value;
            const end = total ? (offset / total) * 360 : 0;
            return `${item.color} ${start}deg ${end}deg`;
          }).join(", ");
          return `
            <div class="chart-shell">
              <div class="donut-shell">
                <div class="donut" style="background: conic-gradient(${stops});">
                  ${report.view.chartType === "donut" ? `
                    <div class="donut-center">
                      <div><strong>${total}</strong>rows</div>
                    </div>
                  ` : ""}
                </div>
              </div>
              <div class="badge-row">
                ${chartData.map(item => `<span class="badge">${escapeHtml(item.label)} · ${item.value}</span>`).join("")}
              </div>
            </div>
          `;
        }
        if (report.view.chartType === "column") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          return `
            <div class="vertical-chart">
              <div class="vertical-chart-bars">
                ${chartData.map(item => `
                  <div class="vertical-bar">
                    <div class="micro">${item.value}</div>
                    <div class="vertical-bar-column" style="height: ${Math.max(18, (item.value / max) * 150)}px; background: linear-gradient(180deg, ${item.color}, ${item.color}cc);"></div>
                    <div class="vertical-bar-label">${escapeHtml(cap(item.label, 16))}</div>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
        }
        if (report.view.chartType === "line" || report.view.chartType === "area") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          const points = chartData.map((item, index) => {
            const x = chartData.length === 1 ? 200 : 20 + (index * (360 / (chartData.length - 1)));
            const y = 200 - ((item.value / max) * 160);
            return { x, y, item };
          });
          const polyline = points.map(point => `${point.x},${point.y}`).join(" ");
          const areaPoints = `20,200 ${polyline} 380,200`;
          return `
            <div class="${report.view.chartType === "area" ? "area-chart" : "line-chart"}">
              <svg viewBox="0 0 400 220" preserveAspectRatio="none">
                <line x1="20" y1="200" x2="380" y2="200" stroke="rgba(23, 49, 38, 0.15)" stroke-width="2"></line>
                ${report.view.chartType === "area" ? `<polygon points="${areaPoints}"></polygon>` : ""}
                <polyline points="${polyline}"></polyline>
                ${points.map(point => `<circle cx="${point.x}" cy="${point.y}" r="5" fill="${point.item.color}"></circle>`).join("")}
              </svg>
              <div class="badge-row">
                ${chartData.map(item => `<span class="badge">${escapeHtml(item.label)} · ${item.value}</span>`).join("")}
              </div>
            </div>
          `;
        }
        if (report.view.chartType === "stacked-bar") {
          const total = chartData.reduce((sum, item) => sum + item.value, 0) || 1;
          return `
            <div class="chart-shell">
              <div class="stacked-track">
                ${chartData.map(item => `<div class="stacked-segment" style="width:${(item.value / total) * 100}%; background:${item.color};"></div>`).join("")}
              </div>
              <div class="badge-row">
                ${chartData.map(item => `<span class="badge">${escapeHtml(item.label)} · ${item.value}</span>`).join("")}
              </div>
            </div>
          `;
        }
        if (report.view.chartType === "stacked-column") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          return `
            <div class="stacked-columns">
              ${chartData.map(item => `
                <div class="stacked-column">
                  <div class="micro">${item.value}</div>
                  <div class="stacked-column-bar" style="height:${Math.max(24, (item.value / max) * 160)}px;">
                    <div class="stacked-segment" style="height:100%; background:${item.color};"></div>
                  </div>
                  <div class="vertical-bar-label">${escapeHtml(cap(item.label, 14))}</div>
                </div>
              `).join("")}
            </div>
          `;
        }
        if (report.view.chartType === "funnel") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          return `
            <div class="funnel-chart">
              ${chartData.map(item => `
                <div class="funnel-step" style="width:${Math.max(34, (item.value / max) * 100)}%; background:${item.color};">
                  ${escapeHtml(item.label)} · ${item.value}
                </div>
              `).join("")}
            </div>
          `;
        }
        if (report.view.chartType === "heatmap") {
          const max = Math.max(...chartData.map(item => item.value), 1);
          return `
            <div class="heat-grid">
              ${chartData.map(item => `
                <div class="heat-cell" style="background: rgba(13, 124, 102, ${0.22 + ((item.value / max) * 0.68)});">
                  <strong>${item.value}</strong>
                  <span>${escapeHtml(item.label)}</span>
                </div>
              `).join("")}
            </div>
          `;
        }
        const max = Math.max(...chartData.map(item => item.value), 1);
        return `
          <div class="chart-bars">
            ${chartData.map(item => `
              <div class="chart-bar-row">
                <div class="chart-bar-top">
                  <span>${escapeHtml(item.label)}</span>
                  <strong>${item.value}</strong>
                </div>
                <div class="chart-track">
                  <div class="chart-fill" style="width: ${(item.value / max) * 100}%; background: linear-gradient(90deg, ${item.color}, ${item.color}dd);"></div>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      function renderSummaryReport(report, result) {
        return `
          <div class="stack">
            <div class="summary-row">
              ${result.summary.map(item => `
                <div class="summary-chip">
                  <strong>${escapeHtml(item.value)}</strong>
                  <span>${escapeHtml(item.label)}</span>
                </div>
              `).join("")}
            </div>
            ${result.chartData.length ? `
              <div class="badge-row">
                ${result.chartData.map(item => `<span class="badge">${escapeHtml(item.label)} · ${item.value}</span>`).join("")}
              </div>
            ` : ""}
          </div>
        `;
      }

      function renderTimelineReport(report, result) {
        ensureReportViewConfig(report);
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const startFieldId = report.view.timelineDateField;
        const endFieldId = report.view.timelineEndField;
        const titleFieldId = report.view.titleFieldId || report.selectedFields[0]?.fieldId;
        const rows = result.rows
          .filter(row => row[startFieldId])
          .sort((left, right) => new Date(left[startFieldId]) - new Date(right[startFieldId]));
        if (!rows.length) {
          return `<div class="empty-state"><strong>No timeline items</strong><div class="hint">Choose a date field with values.</div></div>`;
        }
        return `
          <div class="data-list-shell">
            <div class="timeline-list">
            ${rows.map(row => `
              <div class="timeline-item">
                <div class="space-between">
                  <strong>${escapeHtml(formatCellValue(fieldMap[titleFieldId], row[titleFieldId]) || "Untitled")}</strong>
                  <span class="badge brand">${escapeHtml(fmtDate(row[startFieldId]))}</span>
                </div>
                ${endFieldId && row[endFieldId] ? `<div class="micro">Ends ${escapeHtml(fmtDate(row[endFieldId]))}</div>` : ""}
              </div>
            `).join("")}
            </div>
          </div>
        `;
      }

      function renderCalendarReport(report, result) {
        ensureReportViewConfig(report);
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const dateFieldId = report.view.calendarDateField;
        const titleFieldId = report.view.titleFieldId || report.selectedFields[0]?.fieldId;
        const rows = result.rows.filter(row => row[dateFieldId]);
        if (!rows.length) {
          return `<div class="empty-state"><strong>No calendar items</strong><div class="hint">Choose a date field with values.</div></div>`;
        }
        const buckets = new Map();
        rows.forEach(row => {
          const date = new Date(row[dateFieldId]);
          const key = Number.isNaN(date.getTime()) ? "Unknown" : date.toISOString().slice(0, 10);
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(row);
        });
        return `
          <div class="data-list-shell">
            <div class="calendar-grid">
            ${Array.from(buckets.entries()).map(([day, items]) => `
              <div class="calendar-day">
                <strong>${escapeHtml(day === "Unknown" ? "No date" : fmtDate(day))}</strong>
                ${items.map(item => `<span class="badge">${escapeHtml(formatCellValue(fieldMap[titleFieldId], item[titleFieldId]) || "Untitled")}</span>`).join("")}
              </div>
            `).join("")}
            </div>
          </div>
        `;
      }

      function renderKanbanReport(report, result) {
        ensureReportViewConfig(report);
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const laneFieldId = report.view.kanbanField;
        const titleFieldId = report.view.titleFieldId || report.selectedFields[0]?.fieldId;
        const buckets = new Map();
        result.rows.forEach(row => {
          const key = Array.isArray(row[laneFieldId]) ? row[laneFieldId].join(", ") : String(row[laneFieldId] || "Unassigned");
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(row);
        });
        if (!buckets.size) {
          return `<div class="empty-state"><strong>No board items</strong><div class="hint">Choose a board field with values.</div></div>`;
        }
        return `
          <div class="data-list-shell">
            <div class="kanban-board">
            ${Array.from(buckets.entries()).map(([lane, items], index) => `
              <div class="kanban-column">
                <div class="space-between">
                  <strong>${escapeHtml(lane)}</strong>
                  <span class="badge" style="border-color:${COLORS[index % COLORS.length]}33; color:${COLORS[index % COLORS.length]};">${items.length}</span>
                </div>
                <div class="kanban-list">
                  ${items.map(item => `
                    <div class="kanban-card">
                      <strong>${escapeHtml(formatCellValue(fieldMap[titleFieldId], item[titleFieldId]) || "Untitled")}</strong>
                    </div>
                  `).join("")}
                </div>
              </div>
            `).join("")}
            </div>
          </div>
        `;
      }

      function renderMiniTable(report, result) {
        const table = resolveTable(report.source.tableId);
        const fieldMap = Object.fromEntries((table?.fields || []).map(field => [field.id, field]));
        const columns = report.selectedFields.map(item => item.fieldId);
        return `
          <div class="data-list-shell">
            <table class="mini-table">
              <thead>
                <tr>${columns.map(fieldId => `<th>${escapeHtml(fieldMap[fieldId]?.label || fieldId)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${result.rows.map(row => `
                  <tr>
                    ${columns.map(fieldId => `<td>${escapeHtml(formatCellValue(fieldMap[fieldId], row[fieldId]))}</td>`).join("")}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderReportCanvas(report, validation) {
        ensureReportViewConfig(report);
        const result = runReport(report, {});
        const showMetricHeader = report.view.mode !== "summary";
        return `
          ${validation.warnings.length ? `
            <div class="card warn section">
              <div class="card-head">
                <strong>Attention needed</strong>
                <span class="badge warn">${validation.warnings.length}</span>
              </div>
              <div class="hint">${escapeHtml(validation.warnings[0])}</div>
            </div>
          ` : ""}
          ${showMetricHeader ? `
            <div class="section">
              <div class="summary-row">
                ${result.summary.map(item => `
                  <div class="summary-chip">
                    <strong>${escapeHtml(item.value)}</strong>
                    <span>${escapeHtml(item.label)}</span>
                  </div>
                `).join("")}
                <div class="summary-chip">
                  <strong>${result.totalRows}</strong>
                  <span>Rows after filters</span>
                </div>
              </div>
            </div>
          ` : ""}
          <div class="section">
            <div class="section-head">
              <div class="section-title">Live preview</div>
              <div class="section-meta">${resolveTable(report.source.tableId)?.name || "Missing table"}</div>
            </div>
            <div class="card">
              ${renderReportDisplay(report, result)}
            </div>
          </div>
        `;
      }

      function renderInspector(object, validation) {
        if (!object) {
          return `
            <div class="section">
              <div class="card soft">
                <strong>Builder details</strong>
                <div class="hint">Select a report or dashboard to edit fields, layout, filters, sharing, templates, and version-safe settings.</div>
              </div>
            </div>
          `;
        }
        return object.type === "dashboard"
          ? renderDashboardInspector(object, validation)
          : renderReportInspector(object, validation);
      }

        const prefs = getPreferenceBucket(dashboard.id);

                      <div class="inline-row">

      function renderReportInspector(report, validation) {
        ensureReportViewConfig(report);
        const table = resolveTable(report.source.tableId);
        const fields = table ? table.fields : [];
        const previewCount = Array.isArray(state.data[report.source.tableId]) ? state.data[report.source.tableId].length : 0;
        const availableFields = fields.filter(field => {
          const notChosen = !report.selectedFields.some(selected => selected.fieldId === field.id);
          const matches = field.label.toLowerCase().includes(state.ui.fieldSearch.toLowerCase());
          return notChosen && matches;
        });
        const permissions = report.permissions || {};
        return `
          <div class="section">
            <div class="pill-row">

      function renderModalContent() {
        if (state.ui.modal === "create") {
          const type = state.ui.createDraft.type;

          return `
            <div class="modal-head">
              <div>
                <strong>Create ${type}</strong>
                <div class="hint">Start fresh or use a reusable template.</div>
              </div>
              <button class="ghost-button" data-action="close-modal">Close</button>
            </div>
            <div class="modal-body" data-scroll-key="modal-body">
              <div class="field-grid">
                <label class="label">Type

                    <option value="dashboard" ${type === "dashboard" ? "selected" : ""}>Dashboard</option>

                  <label class="label">Source table

                  </label>

                </div>
                <div class="card">

                    <div class="section-title">Fields</div>
                    <div class="section-meta">${state.ui.createDraft.selectedFieldIds.length} selected</div>
                  </div>
                  ${renderFieldPicker(sourceTable?.fields || [], state.ui.createDraft.selectedFieldIds, state.ui.createDraft.fieldQuery, "create-field-query", "create-field-toggle")}
                </div>
                <div class="card">
                  <div class="section-title">Filters and sorting</div>
                  ${renderDraftQuerySettings(sourceTable?.fields || [], state.ui.createDraft, "create")}
                </div>
                <div class="card soft">
                  <div class="section-title">View</div>
                  ${renderReportViewSettings(sourceTable?.fields || [], state.ui.createDraft, "create")}

              </label>
              <div class="inline-row">
                <button class="button" data-action="create-confirm">Create</button>
              </div>
            </div>
          `;
        }
        if (state.ui.modal === "addWidget") {
          const dashboard = getActiveObject();
          const reports = state.catalog.order.map(id => state.catalog.objects[id]).filter(item => item?.type === "report");
          const draft = state.ui.addWidgetDraft;
          const sourceTable = resolveTable(draft.tableId);
          return `
            <div class="modal-head">
              <div>
                <strong>Add widget</strong>
                <div class="hint">Use an existing report or build a new report/graph here without leaving the dashboard.</div>
              </div>
              <button class="ghost-button" data-action="close-modal">Close</button>
            </div>
            <div class="modal-body" data-scroll-key="modal-body">
              <div class="pill-row">
                <button class="${draft.source === "existing" ? "active" : ""}" data-action="add-widget-source" data-value="existing">Use existing</button>
                <button class="${draft.source === "new" ? "active" : ""}" data-action="add-widget-source" data-value="new">Create new</button>
              </div>
              <div class="field-grid">
                <label class="label">Tab
                  <select data-action="add-widget-tab">
                    ${dashboard.tabs.map(tab => `<option value="${tab.id}" ${tab.id === draft.tabId ? "selected" : ""}>${escapeHtml(tab.name)}</option>`).join("")}
                  </select>
                </label>
                ${draft.source === "existing" ? `
                  <label class="label">Report
                    <select data-action="add-widget-report">
                      ${reports.map(report => `<option value="${report.id}" ${report.id === draft.reportId ? "selected" : ""}>${escapeHtml(report.name)}</option>`).join("")}
                    </select>
                  </label>
                ` : `
                  <label class="label">Report name<input type="text" value="${escapeHtml(draft.name)}" data-action="add-widget-new-name"></label>
                `}
              </div>
              ${draft.source === "new" ? `
                <div class="card soft">
                  <div class="section-head">
                    <div class="section-title">Source table</div>

                      ${state.system.providerMode === "quickbase" ? `<button class="mini-button" data-action="provider-connect-load">Connect tables</button>` : ""}

                    </div>
                  </div>
                  <label class="label">Table
                    <select data-action="add-widget-new-table">
                      ${state.metadata.tables.map(table => `<option value="${table.id}" ${table.id === draft.tableId ? "selected" : ""}>${escapeHtml(table.name)}</option>`).join("")}
                    </select>
                  </label>
                  <div class="hint">${state.metadata.app ? "Choose the Quickbase table this new report should pull from." : "Connect Quickbase first to replace the local demo tables with your real app tables."}</div>
                </div>
                <div class="card">
                  <div class="section-head">
                    <div class="section-title">Fields</div>
                    <div class="section-meta">${draft.selectedFieldIds.length} selected</div>
                  </div>
                  ${renderFieldPicker(sourceTable?.fields || [], draft.selectedFieldIds, draft.fieldQuery, "add-widget-field-query", "add-widget-field-toggle")}
                  <div class="hint">Pick the main fields for the report preview and export. You can fine-tune the report after adding it.</div>
                </div>
                <div class="card">
                  <div class="section-title">Filters and sorting</div>
                  ${renderDraftQuerySettings(sourceTable?.fields || [], draft, "add-widget")}
                </div>
                <div class="card soft">
                  <div class="section-title">View</div>
                  ${renderReportViewSettings(sourceTable?.fields || [], draft, "add-widget")}

              ` : ""}
              <div class="option-grid">
                <button class="option-card ${draft.mode === "linked" ? "active" : ""}" data-action="add-widget-mode" data-mode="linked">
                  <strong>Linked</strong>

                <button class="option-card ${draft.mode === "copied" ? "active" : ""}" data-action="add-widget-mode" data-mode="copied">

              <button class="button" data-action="add-widget-confirm">${draft.source === "new" ? "Create report and add widget" : "Add widget"}</button>
            </div>
          `;
        }
        if (state.ui.modal === "upload") {
          const session = state.ui.uploadSession;
          const tableId = session?.tableId || state.metadata.tables[0].id;
          const table = resolveTable(tableId);
          return `
            <div class="modal-head">
              <div>
                <strong>Upload mapping</strong>
                <div class="hint">Preview the generated report before you save it.</div>
              </div>
              <button class="ghost-button" data-action="close-modal">Close</button>
            </div>
            <div class="modal-body" data-scroll-key="modal-body">
              <div class="field-grid">
                <label class="label">Mapping template
                  <select data-action="upload-template">
                    ${state.templates.upload.map(template => `<option value="${template.id}" ${template.tableId === tableId ? "selected" : ""}>${escapeHtml(template.name)}</option>`).join("")}
                  </select>
                </label>
                <label class="label">Destination table
                  <select data-action="upload-table">
                    ${state.metadata.tables.map(item => `<option value="${item.id}" ${item.id === tableId ? "selected" : ""}>${escapeHtml(item.name)}</option>`).join("")}
                  </select>
                </label>
              </div>
              <label class="label">CSV file<input type="file" accept=".csv" data-action="upload-file"></label>
              ${session ? `
                <div class="card">
                  <div class="card-head">
                    <strong>${escapeHtml(session.fileName)}</strong>
                    <span class="badge">${session.headers.length} columns</span>
                  </div>
                  <div class="stack">
                    ${session.headers.map(header => `
                      <label class="label">${escapeHtml(header)}
                        <select data-action="upload-map" data-header="${escapeHtml(header)}">
                          <option value="">Skip</option>
                          ${table.fields.map(field => `<option value="${field.id}" ${session.columnMap[header] === field.id ? "selected" : ""}>${escapeHtml(field.label)}</option>`).join("")}
                        </select>
                      </label>
                    `).join("")}
                  </div>
                  <div class="inline-row">
                    <button class="ghost-button" data-action="upload-apply" data-mode="create">Create report</button>
                    <button class="button" data-action="upload-apply" data-mode="replace">Replace current report</button>
                  </div>
                </div>
              ` : `<div class="hint">Upload a CSV to preview mappings and create a reusable report draft.</div>`}
            </div>
          `;
        }
        return "";
      }

        return state.ui.toasts.map(toast => `

            <strong>${toast.tone === "danger" ? "Action needed" : toast.tone === "warn" ? "Heads up" : "Saved"}</strong>
