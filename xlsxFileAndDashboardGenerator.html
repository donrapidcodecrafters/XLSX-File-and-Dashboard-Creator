          name,
          widgets: []

        return {
          id: uid("widget"),

          reportRef: mode === "copied"
            ? { mode: "copied", reportId: report.id, snapshot: deepClone(report) }

          name,

      function createSeedState() {
        const tables = buildMetadata();
        const data = buildSampleData(tables);

        const projects = createReport("Project Portfolio", "projects", ["recordId", "projectName", "status", "owner", "region", "budget", "startDate", "completion"], tables.find(table => table.id === "projects"));
        projects.filters = [{ id: uid("filter"), fieldId: "status", operator: "equals", value: "Active" }];
        projects.summary.metrics = [
          { id: uid("metric"), fieldId: "recordId", op: "count", label: "Projects" },
          { id: uid("metric"), fieldId: "budget", op: "sum", label: "Budget" },
          { id: uid("metric"), fieldId: "completion", op: "avg", label: "Avg progress" }
        ];
        projects.view.mode = "chart";
        projects.view.chartType = "bar";
        projects.view.chartFieldId = "region";
        projects.chart = { enabled: true, type: "bar", labelField: "region" };

        const tasks = createReport("Task Pipeline", "tasks", ["recordId", "taskName", "projectName", "status", "assignee", "priority", "dueDate", "hours"], tables.find(table => table.id === "tasks"));
        tasks.groups = [{ id: uid("group"), fieldId: "status" }];
        tasks.summary.metrics = [

          { id: uid("metric"), fieldId: "hours", op: "sum", label: "Hours" }
        ];
        tasks.view.mode = "kanban";
        tasks.view.kanbanField = "status";
        tasks.view.titleFieldId = "taskName";
        tasks.chart = { enabled: false, type: "donut", labelField: "status" };

        const invoices = createReport("Invoice Health", "invoices", ["recordId", "customer", "region", "amount", "invoiceDate", "paidDate", "status"], tables.find(table => table.id === "invoices"));
        invoices.filters = [{ id: uid("filter"), fieldId: "status", operator: "equals", value: "Open" }];
        invoices.summary.metrics = [
          { id: uid("metric"), fieldId: "recordId", op: "count", label: "Invoices" },

        const objects = {

          [projects.id]: projects,

        const stateObject = {
          system: defaultSystemState(),
          metadata: { tables },
          data,
          catalog: {
            objects,
            order: [dashboard.id, projects.id, tasks.id, invoices.id],
            recent: [dashboard.id]
          },
          preferences: {},
          versions: {},
          templates: {

              {
                id: uid("tpl"),
                type: "layout",
                name: "Executive starter",
                template: deepClone(dashboard)

            yaml: [
              {
                id: uid("tpl"),
                type: "yaml",
                name: "Grouped task report",

              }
            ],
            upload: [
              {
                id: uid("tpl"),
                type: "upload",
                name: "Invoice import mapping",
                tableId: "invoices",

                  Customer: "customer",
                  Region: "region",
                  Amount: "amount",
                  Status: "status"
                },
                template: null
              }
            ]
          },
          exportJobs: [],
          sessions: {
            resultCache: {}
          },
          history: { undo: [], redo: [] },
          ui: {
            mode: "builder",
            libraryQuery: "",
            libraryType: "all",
            libraryOwner: "all",
            libraryFavoritesOnly: false,
            libraryRecentOnly: false,
            activeObjectId: dashboard.id,
            selectedWidgetId: overviewTab.widgets[0].id,
            selectedTabId: overviewTab.id,
            objectInspectorTab: "design",
            reportInspectorTab: "fields",
            widgetSearch: "",
            fieldSearch: "",
            drawer: null,
            modal: null,
            yamlDraft: "",
            yamlPreview: null,
            createDraft: buildCreateDraft("dashboard"),
            addWidgetDraft: {
              source: "existing",
              reportId: projects.id,
              mode: "linked",
              tabId: overviewTab.id,
              name: "Quick widget report",
              tableId: "projects",
              selectedFieldIds: ["recordId", "projectName", "status", "owner", "region"],
              fieldQuery: "",
              viewMode: "chart",
              chartType: "bar",
              chartFieldId: "status",
              timelineDateField: "startDate",
              timelineEndField: "",
              calendarDateField: "startDate",
              kanbanField: "status",
              titleFieldId: "projectName"
            },

      function buildSampleData(tables) {
        const regions = ["North", "South", "East", "West"];
        const projectStatuses = ["Active", "At risk", "Closed", "Planning"];
        const taskStatuses = ["Open", "Blocked", "Done", "In review"];
        const invoiceStatuses = ["Open", "Paid", "Late", "Disputed"];
        const users = ["Ana", "Ben", "Cora", "Drew", "Eli"];
        const tags = ["Strategic", "Renewal", "Migration", "Internal"];
        const priorities = ["Low", "Medium", "High", "Urgent"];
        const projects = [];
        const tasks = [];
        const invoices = [];
        for (let index = 1; index <= 180; index += 1) {
          projects.push({
            recordId: index,
            projectName: "Project " + index,
            status: projectStatuses[index % projectStatuses.length],
            owner: users[index % users.length],
            region: regions[index % regions.length],
            budget: 15000 + (index * 925),
            startDate: new Date(2025, index % 12, (index % 28) + 1).toISOString(),
            completion: Math.round((index * 7) % 100),
            tags: [tags[index % tags.length], tags[(index + 2) % tags.length]].filter((value, position, array) => array.indexOf(value) === position)
          });
        }
        for (let index = 1; index <= 320; index += 1) {
          tasks.push({
            recordId: index,
            taskName: "Task " + index,
            projectName: "Project " + ((index % 60) + 1),
            status: taskStatuses[index % taskStatuses.length],
            assignee: users[index % users.length],
            priority: [priorities[index % priorities.length]],
            dueDate: new Date(2025, (index + 1) % 12, (index % 28) + 1).toISOString(),
            hours: (index % 12) + 2
          });
        }
        for (let index = 1; index <= 210; index += 1) {
          invoices.push({
            recordId: index,
            customer: "Customer " + ((index % 42) + 1),
            region: regions[index % regions.length],
            amount: 2200 + (index * 210),
            invoiceDate: new Date(2025, index % 12, (index % 28) + 1).toISOString(),
            paidDate: index % 4 === 0 ? "" : new Date(2025, (index + 1) % 12, ((index + 4) % 28) + 1).toISOString(),
            status: invoiceStatuses[index % invoiceStatuses.length]
          });
        }
        const result = {};
        tables.forEach(table => {
          if (table.id === "projects") result[table.id] = projects;
          if (table.id === "tasks") result[table.id] = tasks;
          if (table.id === "invoices") result[table.id] = invoices;
        });
        return result;
      }

        if (action === "report-table" && object?.type === "report") {
          const table = resolveTable(value);
          commitMutation("Changed table", () => {
            object.source.tableId = value;
            object.selectedFields = [];
            object.filters = [];
            object.groups = [];
            object.sorts = [];
            object.summary.metrics = [];
            object.view = buildReportViewDefaults(table, object.selectedFields.map(item => item.fieldId), "table");
            ensureReportViewConfig(object);
          });
          ensureTablePreviewData(value, collectReportFieldIds(object));
        }
        if (action === "filter-field" && object?.type === "report") {
          commitMutation("Updated filter", () => {
            const filter = object.filters.find(item => item.id === event.target.dataset.filterId);
            if (filter) filter.fieldId = value;
          });
        }
        if (action === "filter-operator" && object?.type === "report") {
          commitMutation("Updated filter", () => {
            const filter = object.filters.find(item => item.id === event.target.dataset.filterId);
            if (filter) filter.operator = value;
          });
        }
        if (action === "filter-value" && object?.type === "report") {
          commitMutation("Updated filter", () => {
            const filter = object.filters.find(item => item.id === event.target.dataset.filterId);
            if (filter) filter.value = value;
          });
        }
        if (action === "new-group" && value && object?.type === "report") {
          createGroup(value);
          event.target.value = "";
        }
        if (action === "new-sort" && value && object?.type === "report") {
          createSort(value);
          event.target.value = "";
        }
        if (action === "sort-field" && object?.type === "report") {
          commitMutation("Updated sort", () => {
            const sort = object.sorts.find(item => item.id === event.target.dataset.sortId);
            if (sort) sort.fieldId = value;
          });
        }
        if (action === "sort-direction" && object?.type === "report") {
          commitMutation("Updated sort", () => {
            const sort = object.sorts.find(item => item.id === event.target.dataset.sortId);
            if (sort) sort.direction = value;
          });
        }
        if (action === "report-view-mode" && object?.type === "report") {
          commitMutation("Updated view", () => {
            object.view.mode = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-chart-type" && object?.type === "report") {
          commitMutation("Updated chart", () => {
            object.view.chartType = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-chart-field" && object?.type === "report") {
          commitMutation("Updated chart", () => {
            object.view.chartFieldId = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-timeline-date" && object?.type === "report") {
          commitMutation("Updated timeline", () => {
            object.view.timelineDateField = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-timeline-end" && object?.type === "report") {
          commitMutation("Updated timeline", () => {
            object.view.timelineEndField = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-calendar-date" && object?.type === "report") {
          commitMutation("Updated calendar", () => {
            object.view.calendarDateField = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-kanban-field" && object?.type === "report") {
          commitMutation("Updated kanban", () => {
            object.view.kanbanField = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "report-title-field" && object?.type === "report") {
          commitMutation("Updated titles", () => {
            object.view.titleFieldId = value;
            ensureReportViewConfig(object);
          });
        }
        if (action === "metric-field" && object?.type === "report") {
          commitMutation("Updated metric", () => {
            const metric = object.summary.metrics.find(item => item.id === event.target.dataset.metricId);
            if (metric) metric.fieldId = value;
          });
        }
        if (action === "metric-op" && object?.type === "report") {
          commitMutation("Updated metric", () => {
            const metric = object.summary.metrics.find(item => item.id === event.target.dataset.metricId);
            if (metric) metric.op = value;
          });
        }
        if (action === "metric-label" && object?.type === "report") {
          commitMutation("Updated metric", () => {
            const metric = object.summary.metrics.find(item => item.id === event.target.dataset.metricId);
            if (metric) metric.label = value;
          });
        }
        if (action === "yaml-draft") {
          state.ui.yamlDraft = value;
        }
        if (action === "create-type") {
          const next = buildCreateDraft(value);
          next.name = state.ui.createDraft.name;
          state.ui.createDraft = next;
          render();
        }
        if (action === "create-name") {
          state.ui.createDraft.name = value;
        }
        if (action === "create-template") {
          state.ui.createDraft.templateId = value;
        }
        if (action === "create-table") {
          syncCreateDraftForTable(value);
          render();
        }
        if (action === "add-widget-report") {
          state.ui.addWidgetDraft.reportId = value;
        }
        if (action === "add-widget-tab") {
          state.ui.addWidgetDraft.tabId = value;
        }
        if (action === "add-widget-new-name") {
          state.ui.addWidgetDraft.name = value;
        }
        if (action === "add-widget-new-table") {
          syncAddWidgetDraftForTable(value);
          render();
          ensureTablePreviewData(value, state.ui.addWidgetDraft.selectedFieldIds);
        }
        if (action === "create-view-mode") {
          state.ui.createDraft.viewMode = value;
          syncCreateDraftForTable(state.ui.createDraft.tableId);
          render();
        }
        if (action === "create-chart-type") {
          state.ui.createDraft.chartType = value;
          render();
        }
        if (action === "create-chart-field") {
          state.ui.createDraft.chartFieldId = value;
        }
        if (action === "create-timeline-date") {
          state.ui.createDraft.timelineDateField = value;
        }
        if (action === "create-timeline-end") {
          state.ui.createDraft.timelineEndField = value;
        }
        if (action === "create-calendar-date") {
          state.ui.createDraft.calendarDateField = value;
        }
        if (action === "create-kanban-field") {
          state.ui.createDraft.kanbanField = value;
        }
        if (action === "create-title-field") {
          state.ui.createDraft.titleFieldId = value;
        }
        if (action === "add-widget-view-mode") {
          state.ui.addWidgetDraft.viewMode = value;
          syncAddWidgetDraftForTable(state.ui.addWidgetDraft.tableId);
          render();
        }
        if (action === "add-widget-chart-type") {
          state.ui.addWidgetDraft.chartType = value;
          render();
        }
        if (action === "add-widget-chart-field") {
          state.ui.addWidgetDraft.chartFieldId = value;
        }
        if (action === "add-widget-timeline-date") {
          state.ui.addWidgetDraft.timelineDateField = value;
        }
        if (action === "add-widget-timeline-end") {
          state.ui.addWidgetDraft.timelineEndField = value;
        }
        if (action === "add-widget-calendar-date") {
          state.ui.addWidgetDraft.calendarDateField = value;
        }
        if (action === "add-widget-kanban-field") {
          state.ui.addWidgetDraft.kanbanField = value;
        }
        if (action === "add-widget-title-field") {
          state.ui.addWidgetDraft.titleFieldId = value;
        }
        if (action === "upload-table") {
          if (!state.ui.uploadSession) return;
          state.ui.uploadSession.tableId = value;
          render();
        }
        if (action === "upload-map" && state.ui.uploadSession) {
          state.ui.uploadSession.columnMap[event.target.dataset.header] = value;
        }
        if (action === "upload-template") {
          const template = state.templates.upload.find(item => item.id === value);
          if (template) {
            if (!state.ui.uploadSession) {
              state.ui.uploadSession = {
                fileName: "",
                headers: [],
                sampleRows: [],
                tableId: template.tableId,
                columnMap: deepClone(template.columnMap)
              };
            } else {
              state.ui.uploadSession.tableId = template.tableId;
              state.ui.uploadSession.columnMap = deepClone(template.columnMap);
            }
          }
          render();
        }
      }

      function handleChange(event) {
        if (event.target.dataset.action === "upload-file") {
          handleUploadFile(event.target.files[0]);
        }
      }

      function handleKeydown(event) {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveActiveObject("save");
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z" && !event.shiftKey) {
          event.preventDefault();
          undo();
        }
        if (((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z" && event.shiftKey) || ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "y")) {
          event.preventDefault();
          redo();
        }
        if (event.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
          event.preventDefault();
          const input = document.querySelector('[data-action="library-query"]');
          if (input) input.focus();
        }
      }

      function handleDragStart(event) {
        const source = event.target.closest("[data-drag-kind]");
        if (!source) return;
        dragPayload = {
          kind: source.dataset.dragKind,
          id: source.dataset.dragId
        };
        event.dataTransfer.effectAllowed = "move";
      }

      function handleDragOver(event) {
        if (event.target.closest("[data-drop-kind]")) {
          event.preventDefault();
        }
      }

      function handleDrop(event) {
        const target = event.target.closest("[data-drop-kind]");
        if (!target || !dragPayload || dragPayload.kind !== target.dataset.dropKind) return;
        event.preventDefault();
        const object = getActiveObject();
        if (!object) return;
        commitMutation("Reordered items", () => {
          if (dragPayload.kind === "tab" && object.type === "dashboard") {
            object.tabs = reorderItems(object.tabs, dragPayload.id, target.dataset.dropId);
          }
          if (dragPayload.kind === "widget" && object.type === "dashboard") {
            const tab = activeDashboardTab(object);
            tab.widgets = reorderItems(tab.widgets, dragPayload.id, target.dataset.dropId);
          }
          if (dragPayload.kind === "field" && object.type === "report") {
            object.selectedFields = reorderItems(object.selectedFields, dragPayload.id, target.dataset.dropId);
          }
          if (dragPayload.kind === "filter" && object.type === "report") {
            object.filters = reorderItems(object.filters, dragPayload.id, target.dataset.dropId);
          }
          if (dragPayload.kind === "group" && object.type === "report") {
            object.groups = reorderItems(object.groups, dragPayload.id, target.dataset.dropId);
          }
          if (dragPayload.kind === "sort" && object.type === "report") {
            object.sorts = reorderItems(object.sorts, dragPayload.id, target.dataset.dropId);
          }
        });
        dragPayload = null;
      }

      function wireEvents() {
        document.addEventListener("click", handleClick);
        document.addEventListener("input", handleInput);
        document.addEventListener("change", handleChange);
        document.addEventListener("keydown", handleKeydown);
        document.addEventListener("dragstart", handleDragStart);
        document.addEventListener("dragover", handleDragOver);
        document.addEventListener("drop", handleDrop);
        window.addEventListener("hashchange", handleHashChange);
      }

      function boot() {
        appNode = document.getElementById("app");
        state = loadState();
        applyRouteStateFromLocation();
        restoreScopedQuickbaseStorageConfig(state.system.quickbase);
        persistScopedQuickbaseStorageConfig(state.system.quickbase);
        const routeContext = getHostedRouteContext();
        if (routeContext.forcedViewer) {
          state.ui.mode = "viewer";
        } else if (routeContext.mode === "builder") {
          state.ui.mode = "builder";
        }
        if (state.system.providerMode === "quickbase") {
          setSyncState(
            state.system.pendingSync ? "pending" : (quickbaseConfigured() ? "ok" : "pending"),
            state.system.pendingSync
              ? (state.system.pendingReason || "Changes are waiting to sync.")
              : (quickbaseConfigured() ? (state.system.syncMessage || "Quickbase sync is ready.") : "Add the Quickbase endpoint URL to connect.")
          );
        } else {
          setSyncState("local", "Working in browser-only mode.");
        }
        wireEvents();
        scheduleActiveObjectLoading();
        render();
        if (state.system.providerMode === "quickbase" && quickbaseConfigured()) {
          if (usingDirectQuickbaseApi() && (!state.metadata.app || hasDirectQuickbaseObjectStorage() || state.system.quickbase.bootstrapOnLoad)) {
            pullProviderState({ silent: true });
          } else if (state.system.quickbase.bootstrapOnLoad) {
            pullProviderState({ silent: true });
          }
        }
      }

      boot();
    })();
  </script>
</body>
</html>
