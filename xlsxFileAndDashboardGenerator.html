        await quickbaseWriteRecordBatches(storage.versionTableId, rows);
        return rows.length;
      }

      async function loadDirectQuickbaseStorageBundle() {
        if (!hasDirectQuickbaseObjectStorage()) return null;
        const storage = directQuickbaseStorage();
        const objectRows = await quickbaseFetchAllRecords(storage.objectTableId, [
          3,
          storage.objectKeyFieldId,
          storage.objectTypeFieldId,
          storage.objectNameFieldId,
          storage.objectConfigFieldId,
          storage.objectOwnerFieldId,
          storage.objectUpdatedAtFieldId,
          storage.objectUpdatedByFieldId
        ], "", {
          top: 200,
          sortBy: storage.objectUpdatedAtFieldId ? [{ fieldId: qbFieldId(storage.objectUpdatedAtFieldId), order: "DESC" }] : undefined
        });
        const objects = {};
        const order = [];
        const objectRecordIds = {};
        objectRows.forEach(row => {
          const parsed = safeJsonParse(qbFieldValue(row, storage.objectConfigFieldId));
          if (!parsed || typeof parsed !== "object") return;
          const objectId = String(qbFieldValue(row, storage.objectKeyFieldId) || parsed.id || parsed.objectId || "");
          if (!objectId) return;
          parsed.id = objectId;
          parsed.type = parsed.type || qbFieldValue(row, storage.objectTypeFieldId) || "report";
          parsed.name = qbFieldValue(row, storage.objectNameFieldId) || parsed.name || objectId;
          parsed.ownerId = qbFieldValue(row, storage.objectOwnerFieldId) || parsed.ownerId || CURRENT_USER.id;
          parsed.updatedAt = qbFieldValue(row, storage.objectUpdatedAtFieldId) || parsed.updatedAt || nowIso();
          objects[objectId] = parsed;
          order.push(objectId);
          objectRecordIds[objectId] = qbFieldValue(row, 3);
        });
        const preferences = {};
        if (hasDirectQuickbaseSettingsStorage()) {
          const settingsRows = await quickbaseFetchAllRecords(storage.userSettingsTableId, [
            storage.settingsUserFieldId,
            storage.settingsObjectFieldId,
            storage.settingsObjectKeyFieldId,
            storage.settingsJsonFieldId,
            storage.settingsUpdatedByFieldId
          ], buildQuickbaseWhere([
            { fid: storage.settingsUserFieldId, value: CURRENT_USER.id }
          ]), { top: 200 });
          settingsRows.forEach(row => {
            const objectId = String(qbFieldValue(row, storage.settingsObjectKeyFieldId) || "");
            if (isDirectStorageConfigRecordKey(objectId)) return;
            const parsed = safeJsonParse(qbFieldValue(row, storage.settingsJsonFieldId), {});
            if (!objectId || !parsed || typeof parsed !== "object") return;
            if (!preferences[objectId]) preferences[objectId] = {};
            preferences[objectId][CURRENT_USER.id] = parsed;
          });
        }
        const versions = {};
        if (hasDirectQuickbaseVersionStorage()) {
          const versionRows = await quickbaseFetchAllRecords(storage.versionTableId, [
            3,
            storage.versionObjectFieldId,
            storage.versionObjectKeyFieldId,
            storage.versionSnapshotFieldId,
            storage.versionChangedAtFieldId,
            storage.versionChangedByFieldId,
            storage.versionUpdatedByFieldId
          ], "", {
            top: 200,
            sortBy: storage.versionChangedAtFieldId ? [{ fieldId: qbFieldId(storage.versionChangedAtFieldId), order: "DESC" }] : undefined
          });
          versionRows.forEach(row => {
            const objectId = String(qbFieldValue(row, storage.versionObjectKeyFieldId) || "");
            if (!objectId) return;
            const payload = safeJsonParse(qbFieldValue(row, storage.versionSnapshotFieldId));
            let entry = null;
            if (payload && payload.snapshot && typeof payload.snapshot === "object") {
              entry = {
                id: payload.id || ("ver_" + objectId + "_" + (payload.changedAt || qbFieldValue(row, storage.versionChangedAtFieldId) || qbFieldValue(row, 3))),
                message: payload.message || "Saved changes",
                changedAt: payload.changedAt || qbFieldValue(row, storage.versionChangedAtFieldId) || nowIso(),
                changedBy: payload.changedBy || qbFieldValue(row, storage.versionChangedByFieldId) || CURRENT_USER.name,
                snapshot: payload.snapshot
              };
            } else if (payload && typeof payload === "object") {
              entry = {
                id: "ver_" + objectId + "_" + (qbFieldValue(row, storage.versionChangedAtFieldId) || qbFieldValue(row, 3)),
                message: "Saved changes",
                changedAt: qbFieldValue(row, storage.versionChangedAtFieldId) || payload.updatedAt || nowIso(),
                changedBy: qbFieldValue(row, storage.versionChangedByFieldId) || payload.changedBy || CURRENT_USER.name,
                snapshot: payload
              };
            }
            if (!entry) return;
            if (!versions[objectId]) versions[objectId] = [];
            versions[objectId].push(entry);
          });
          Object.keys(versions).forEach(objectId => {
            versions[objectId].sort((left, right) => new Date(right.changedAt || 0) - new Date(left.changedAt || 0));
          });
        }
        return {
          catalog: {
            objects,
            order,
            recent: order.slice(0, 1)
          },
          preferences,
          versions,
          objectRecordIds
        };
      }

      function applyDirectQuickbaseStorageBundle(bundle) {
        if (!bundle) return false;
        const remoteObjects = bundle.catalog?.objects || {};
        const hasRemoteObjects = Object.keys(remoteObjects).length > 0;
        if (hasRemoteObjects) {
          state.catalog = deepClone(bundle.catalog);
        }
        if (bundle.preferences && Object.keys(bundle.preferences).length) {
          state.preferences = deepClone(bundle.preferences);
        } else if (hasRemoteObjects) {
          state.preferences = {};
        }
        if (bundle.versions && Object.keys(bundle.versions).length) {
          state.versions = deepClone(bundle.versions);
        } else if (hasRemoteObjects) {
          state.versions = {};
        }
        normalizeStudioState(state);
        state.sessions.resultCache = {};
        state.sessions.previewLoads = {};
        state.sessions.previewFieldIds = {};
        if (!state.catalog.objects[state.ui.activeObjectId]) {
          state.ui.activeObjectId = state.catalog.order[0] || null;
        }
        const active = getActiveObject();
        if (active?.type === "dashboard") {
          state.ui.selectedTabId = active.tabs[0]?.id || null;
        } else {
          state.ui.selectedTabId = null;
        }
        scheduleActiveObjectLoading();
        return hasRemoteObjects;
      }

      function mapQuickbaseFieldType(field) {
        const raw = String(field.fieldType || "").toLowerCase();
        const mode = String(field.mode || "").toLowerCase();
        if (mode === "lookup") return "lookup";
        if (mode === "summary") return "summary";
        if (mode === "formula") {
          if (raw === "date") return "date";
          if (raw === "timestamp") return "datetime";
          if (["numeric", "float", "currency", "percent"].includes(raw)) return "formula-number";
          return "formula-text";
        }
        if (raw === "date") return "date";
        if (raw === "timestamp") return "datetime";
        if (raw === "currency") return "currency";
        if (["numeric", "float", "percent"].includes(raw)) return "number";
        if (raw === "user") return "user";
        if (raw === "checkbox") return "text";
        if (raw === "duration") return "number";
        if (raw === "text-multiple-choice" || raw === "multi-select-text") return "multiselect";
        return "text";
      }

      function normalizeQuickbaseField(field) {
        return {
          id: String(field.id),
          label: field.label,
          type: mapQuickbaseFieldType(field),
          quickbase: {
            id: field.id,
            fieldType: field.fieldType,
            mode: field.mode || "",
            raw: deepClone(field)
          },
          options: Array.isArray(field.properties?.choices) ? field.properties.choices.slice(0, 500) : undefined
        };
      }

      function normalizeQuickbaseLabel(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function findQuickbaseTableByNames(tables, names) {
        const wanted = (names || []).map(normalizeQuickbaseLabel);
        return (tables || []).find(table => wanted.includes(normalizeQuickbaseLabel(table.name))) || null;
      }

      function findQuickbaseFieldIdByLabels(fields, labels) {
        const wanted = (labels || []).map(normalizeQuickbaseLabel);
        const match = (fields || []).find(field => wanted.includes(normalizeQuickbaseLabel(field.label)));
        return match ? String(match.id) : "";
      }

      function detectQuickbaseStorageConfigFromMetadata(tables) {
        const detected = {};
        const objectTable = findQuickbaseTableByNames(tables, [
          "Saved Reports",
          "Studio Items",
          "Reporting Studio Items",
          "Saved Studio Items"
        ]);
        if (objectTable) {
          detected.objectTableId = objectTable.id;
          detected.objectKeyFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, [
            "Object ID",
            "Studio Item Key",
            "Studio Item ID",
            "Item Key",
            "Report ID"
          ]);
          detected.objectTypeFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, ["Type", "Object Type"]);
          detected.objectNameFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, ["Name", "Object Name", "Report Name"]);
          detected.objectConfigFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, ["JSON Config", "Config JSON", "Json", "Configuration"]);
          detected.objectOwnerFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, ["Owner", "Object Owner"]);
          detected.objectUpdatedAtFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, ["Updated", "Updated At", "Modified", "Modified At"]);
          detected.objectUpdatedByFieldId = findQuickbaseFieldIdByLabels(objectTable.fields, ["Updated By", "Modified By"]);
        }
        const settingsTable = findQuickbaseTableByNames(tables, [
          "User Report Settings",
          "User Settings",
          "Studio User Settings",
          "Report User Settings"
        ]);
        if (settingsTable) {
          detected.userSettingsTableId = settingsTable.id;
          detected.settingsUserFieldId = findQuickbaseFieldIdByLabels(settingsTable.fields, ["User", "User ID", "Email"]);
          detected.settingsObjectFieldId = findQuickbaseFieldIdByLabels(settingsTable.fields, ["Object Record", "Studio Item Record"]);
          detected.settingsObjectKeyFieldId = findQuickbaseFieldIdByLabels(settingsTable.fields, ["Object", "Object ID", "Studio Item Key", "Report ID"]);
          detected.settingsJsonFieldId = findQuickbaseFieldIdByLabels(settingsTable.fields, ["Json", "JSON", "Settings JSON"]);
          detected.settingsUpdatedByFieldId = findQuickbaseFieldIdByLabels(settingsTable.fields, ["Updated By", "Modified By"]);
        }
        const versionTable = findQuickbaseTableByNames(tables, [
          "Report Version History",
          "Version History",
          "Studio Version History",
          "Saved Report Version History"
        ]);
        if (versionTable) {
          detected.versionTableId = versionTable.id;
          detected.versionObjectFieldId = findQuickbaseFieldIdByLabels(versionTable.fields, ["Object Record", "Studio Item Record"]);
          detected.versionObjectKeyFieldId = findQuickbaseFieldIdByLabels(versionTable.fields, ["Object", "Object ID", "Studio Item Key", "Report ID", "Version"]);
          detected.versionSnapshotFieldId = findQuickbaseFieldIdByLabels(versionTable.fields, ["Json", "JSON", "Snapshot JSON"]);
          detected.versionChangedAtFieldId = findQuickbaseFieldIdByLabels(versionTable.fields, ["Changed At", "Updated At", "Updated", "Modified At"]);
          detected.versionChangedByFieldId = findQuickbaseFieldIdByLabels(versionTable.fields, ["Changed By", "Updated By", "Modified By"]);
          detected.versionUpdatedByFieldId = findQuickbaseFieldIdByLabels(versionTable.fields, ["Updated By", "Changed By", "Modified By"]);
        }
        return normalizeQuickbaseStorageConfig(detected);
      }

      function mergeQuickbaseStorageConfig(storage, detected) {
        const next = Object.assign({}, storage || {});
        let changed = false;
        Object.entries(detected || {}).forEach(([key, value]) => {
          if (!value || next[key]) return;
          next[key] = value;
          changed = true;
        });
        return { next, changed };
      }

      function maybeAutoConfigureQuickbaseStorage(options = {}) {
        const { silent = false } = options;
        if (!usingDirectQuickbaseApi()) return false;
        const detected = detectQuickbaseStorageConfigFromMetadata(state.metadata.tables || []);
        if (!Object.keys(detected).length) return false;
        const merged = mergeQuickbaseStorageConfig(state.system.quickbase.storage, detected);
        if (!merged.changed) return false;
        state.system.quickbase.storage = Object.assign({}, defaultSystemState().quickbase.storage, merged.next);
        persistScopedQuickbaseStorageConfig(state.system.quickbase);
        persistState();
        if (!silent) {
          pushToast("Quickbase storage tables and fields were auto-detected from this app.", "ok");
        }
        return true;
      }

      async function ensureDirectQuickbaseStorageConfigured(options = {}) {
        const { silent = false } = options;
        if (!usingDirectQuickbaseApi()) return false;
        let changed = maybeAutoConfigureQuickbaseStorage({ silent: true });
        if (hasDirectQuickbaseObjectStorage() || hasDirectQuickbaseSettingsStorage() || hasDirectQuickbaseVersionStorage()) {
          if (changed && !silent) pushToast("Quickbase storage tables and fields were auto-detected from this app.", "ok");
          return changed;
        }
        if (!quickbaseConfigured()) return changed;
        const remote = await loadQuickbaseMetadata();
        state.metadata = { tables: remote.tables, app: remote.app };
        resetPreviewDataCache();
        state.system.lastMetadataRefreshAt = nowIso();
        changed = maybeAutoConfigureQuickbaseStorage({ silent: true }) || changed;
        persistState();
        render();
        if (changed && !silent) {
          pushToast("Quickbase storage tables and fields were auto-detected from this app.", "ok");
        }
        return changed;
      }

      async function quickbaseFetchObjectRecordIdMap(storage) {
        if (storage.objectKeyFieldId) {
          return quickbaseFetchRecordIdMap(storage.objectTableId, [storage.objectKeyFieldId]);
        }
        const rows = await quickbaseFetchAllRecords(storage.objectTableId, [3, storage.objectConfigFieldId]);
        const map = new Map();
        rows.forEach(row => {
          const parsed = safeJsonParse(qbFieldValue(row, storage.objectConfigFieldId));
          const objectId = String(parsed?.id || "");
          const recordId = qbFieldValue(row, 3);
          if (objectId && recordId) {
            map.set(makeQuickbaseCompositeKey([objectId]), String(recordId));
          }
        });
        return map;
      }

      function normalizeQuickbaseFieldWriteValue(tableId, fid, value) {
        if (!fid) return value;
        const table = resolveTable(tableId);
        const field = table?.fields?.find(item => item.id === String(fid) || String(item.quickbase?.id) === String(fid)) || null;
        if (!field) return value;
        if ((field.type === "date" || field.quickbase?.fieldType === "date") && value) {
          const date = new Date(value);
          if (!Number.isNaN(date.getTime())) return date.toISOString().slice(0, 10);
        }
        return value;
      }

      function qbSetTableField(data, tableId, fid, value) {
        qbSetField(data, fid, normalizeQuickbaseFieldWriteValue(tableId, fid, value));
      }

      async function loadQuickbaseMetadata() {
        if (quickbaseUseSameOriginXmlApi()) {
          return loadQuickbaseMetadataXml();
        }
        const appId = state.system.quickbase.appId;
        const app = await quickbaseFetch("/apps/" + encodeURIComponent(appId));
        const tables = await quickbaseFetch("/tables?appId=" + encodeURIComponent(appId));
        const fieldGroups = await Promise.all(
          tables.map(table => quickbaseFetch("/fields?tableId=" + encodeURIComponent(table.id)))
        );
        return {
          app: {
            id: app.id,
            name: app.name,
            updated: app.updated,
            description: app.description || ""
          },
          tables: tables.map((table, index) => ({
            id: table.id,
            name: table.name,
            description: table.description || "",
            quickbase: deepClone(table),
            fields: fieldGroups[index].map(normalizeQuickbaseField)
          }))
        };
      }

      async function loadQuickbasePreviewData(tableId, fieldIds, top = 250) {
        const select = (fieldIds || []).map(fieldId => Number(fieldId)).filter(Number.isFinite).slice(0, 30);
        if (!select.length) return [];
        const responseRows = await quickbaseFetchAllRecords(
          tableId,
          compactQuickbaseFieldIds([3].concat(select)),
          "",
          { top: Math.max(200, top || 250) }
        );
        return responseRows.map(record => {
          const row = {
            __recordId: record["3"] ? record["3"].value : ""
          };
          select.forEach(fieldId => {
            row[String(fieldId)] = record[String(fieldId)] ? record[String(fieldId)].value : "";
          });
          return row;
        });
      }

      function resetPreviewDataCache() {
        state.data = {};
        state.sessions.resultCache = {};
        state.sessions.previewFieldIds = {};
        state.sessions.previewLoads = {};
      }

      function collectReportFieldIds(report) {
        if (!report || report.type !== "report") return [];
        ensureReportViewConfig(report);
        const fieldIds = [];
        report.selectedFields.forEach(item => item?.fieldId && fieldIds.push(item.fieldId));
        report.filters.forEach(item => item?.fieldId && fieldIds.push(item.fieldId));
        report.groups.forEach(item => item?.fieldId && fieldIds.push(item.fieldId));
        report.sorts.forEach(item => item?.fieldId && fieldIds.push(item.fieldId));
        (report.summary?.metrics || []).forEach(item => item?.fieldId && fieldIds.push(item.fieldId));
        [
          report.view.chartFieldId,
          report.view.timelineDateField,
          report.view.timelineEndField,
          report.view.calendarDateField,
          report.view.kanbanField,
          report.view.titleFieldId
        ].forEach(fieldId => fieldId && fieldIds.push(fieldId));
        return Array.from(new Set(fieldIds.filter(Boolean).map(String)));
      }

      function collectDashboardReportFieldIds(dashboard, report) {
        const fieldIds = collectReportFieldIds(report);
        if (!dashboard || dashboard.type !== "dashboard") return fieldIds;
        (dashboard.runtimeFilters || []).forEach(filter => {
          const applies = filter.mode === "global" || filter.targetReportIds.includes(report.id);
          if (applies && filter.fieldId) fieldIds.push(String(filter.fieldId));
        });
        return Array.from(new Set(fieldIds));
      }

      function mergePreviewRows(existingRows, incomingRows) {
        const existing = Array.isArray(existingRows) ? existingRows : [];
        const incoming = Array.isArray(incomingRows) ? incomingRows : [];
        if (!existing.length) return incoming;
        if (!incoming.length) return existing;
        const existingById = new Map(existing.filter(row => row && row.__recordId).map(row => [String(row.__recordId), row]));
        const incomingById = new Map(incoming.filter(row => row && row.__recordId).map(row => [String(row.__recordId), row]));
        if (!existingById.size || !incomingById.size) return incoming;
        return incoming.map(row => {
          const recordId = String(row.__recordId || "");
          const prior = existingById.get(recordId);
          return prior ? Object.assign({}, prior, row) : row;
        });
      }

      async function ensureTablePreviewData(tableId, preferredFieldIds) {
        if (!tableId) return;
        const table = resolveTable(tableId);
        if (!table) return;
        const fieldIds = Array.from(new Set(
          ((preferredFieldIds && preferredFieldIds.length ? preferredFieldIds : table.fields.map(field => field.id).slice(0, 12)) || [])
            .filter(Boolean)
            .map(String)
        ));
        if (!fieldIds.length) return;
        const loadedFieldIds = new Set((state.sessions.previewFieldIds[tableId] || []).map(String));
        const cached = state.data[tableId];
        const missingFieldIds = fieldIds.filter(fieldId => !loadedFieldIds.has(String(fieldId)));
        if (Array.isArray(cached) && cached.length && !missingFieldIds.length) return;
        if (state.sessions.previewLoads[tableId]) {
          await state.sessions.previewLoads[tableId];
          return;
        }
        try {
          const loadPromise = loadQuickbasePreviewData(tableId, missingFieldIds.length ? missingFieldIds : fieldIds, 250);
          state.sessions.previewLoads[tableId] = loadPromise;
          const rows = await loadPromise;
          state.data[tableId] = mergePreviewRows(state.data[tableId], rows);
          state.sessions.resultCache = {};
          state.sessions.previewFieldIds[tableId] = Array.from(new Set([]
            .concat(state.sessions.previewFieldIds[tableId] || [])
            .concat((missingFieldIds.length ? missingFieldIds : fieldIds).map(String))
          ));
          render();
        } catch (error) {
          console.error(error);
          pushToast(error.message || "Unable to load table preview data.", "danger");
        } finally {
          delete state.sessions.previewLoads[tableId];
        }
      }

      async function ensureObjectData(object) {
        if (!object || state.system.providerMode !== "quickbase" || !usingDirectQuickbaseApi() || !quickbaseConfigured()) return;
        if (object.type === "report") {
          await ensureTablePreviewData(object.source.tableId, collectReportFieldIds(object));
        }
        if (object.type === "dashboard") {
          const reports = object.tabs.flatMap(tab => tab.widgets.map(widget => resolveWidgetReport(widget))).filter(Boolean);
          for (const report of reports.slice(0, 3)) {
            await ensureTablePreviewData(report.source.tableId, collectDashboardReportFieldIds(object, report));
          }
        }
      }

      function scheduleObjectDataRefresh(object = null) {
        const target = object || getActiveObject();
        if (!target || state.system.providerMode !== "quickbase" || !usingDirectQuickbaseApi() || !quickbaseConfigured()) return;
        if (objectDataRefreshTimer) clearTimeout(objectDataRefreshTimer);
        const objectId = target.id;
        objectDataRefreshTimer = setTimeout(() => {
          objectDataRefreshTimer = null;
          const latest = state.catalog.objects[objectId] || target;
          ensureObjectData(latest).catch(error => {
            console.error(error);
          });
        }, 0);
      }

      function applyRemoteBundle(bundle) {
        if (!bundle || typeof bundle !== "object") throw new Error("The Quickbase response did not include a valid bundle.");
        if (bundle.catalog) state.catalog = deepClone(bundle.catalog);
        if (bundle.preferences) state.preferences = deepClone(bundle.preferences);
        if (bundle.versions) state.versions = deepClone(bundle.versions);
        if (bundle.templates) state.templates = deepClone(bundle.templates);
        if (bundle.exportJobs) state.exportJobs = deepClone(bundle.exportJobs);
        if (bundle.metadata) state.metadata = deepClone(bundle.metadata);
        if (bundle.data) state.data = deepClone(bundle.data);
        state.sessions.resultCache = {};
        if (!state.catalog.objects[state.ui.activeObjectId]) {
          state.ui.activeObjectId = state.catalog.order[0] || null;
        }
        const active = getActiveObject();
        if (active?.type === "dashboard") {
          state.ui.selectedTabId = active.tabs[0]?.id || null;
        } else {
          state.ui.selectedTabId = null;
        }
        scheduleActiveObjectLoading();
      }

      function pushToast(text, tone = "ok") {
        const toast = { id: uid("toast"), tone, text, createdAt: Date.now() };
        state.ui.toasts.push(toast);
        render();
        setTimeout(() => {
          const index = state.ui.toasts.findIndex(item => item.id === toast.id);
          if (index >= 0) {
            state.ui.toasts.splice(index, 1);
            render();
          }
        }, 3600);
      }

      function createHistorySnapshot() {
        return {
          catalog: deepClone(state.catalog),
          preferences: deepClone(state.preferences),
          versions: deepClone(state.versions),
          ui: {
            activeObjectId: state.ui.activeObjectId,
            selectedWidgetId: state.ui.selectedWidgetId,
            selectedTabId: state.ui.selectedTabId,
            objectInspectorTab: state.ui.objectInspectorTab,
            reportInspectorTab: state.ui.reportInspectorTab
          }
        };
      }

      function restoreHistorySnapshot(snapshot) {
        state.catalog = deepClone(snapshot.catalog);
        state.preferences = deepClone(snapshot.preferences);
        state.versions = deepClone(snapshot.versions);
        state.ui.activeObjectId = snapshot.ui.activeObjectId;
        state.ui.selectedWidgetId = snapshot.ui.selectedWidgetId;
        state.ui.selectedTabId = snapshot.ui.selectedTabId;
        state.ui.objectInspectorTab = snapshot.ui.objectInspectorTab;
        state.ui.reportInspectorTab = snapshot.ui.reportInspectorTab;
        scheduleActiveObjectLoading();
        persistState();
        render();
      }

      function commitMutation(message, mutator, options = {}) {
        const { recordHistory = true, versionObjectId = null, skipPersist = false, markDirty = true } = options;
        if (recordHistory) {
          state.history.undo.push(createHistorySnapshot());
          if (state.history.undo.length > MAX_HISTORY) state.history.undo.shift();
          state.history.redo = [];
        }
        mutator();
        if (versionObjectId) {
          saveVersion(versionObjectId, message);
        }
        if (markDirty) {
          markPendingSync(message);
        }
        if (!skipPersist) persistState();
        render();
        scheduleObjectDataRefresh();
      }

      function undo() {
        if (!state.history.undo.length) return;
        state.history.redo.push(createHistorySnapshot());
        const snapshot = state.history.undo.pop();
        restoreHistorySnapshot(snapshot);
        pushToast("Last change undone.", "ok");
      }

      function redo() {
        if (!state.history.redo.length) return;
        state.history.undo.push(createHistorySnapshot());
        const snapshot = state.history.redo.pop();
        restoreHistorySnapshot(snapshot);
        pushToast("Change restored.", "ok");
      }

      function saveVersion(objectId, message) {
        const object = state.catalog.objects[objectId];
        if (!object) return;
        if (!state.versions[objectId]) state.versions[objectId] = [];
        state.versions[objectId].unshift({
          id: uid("ver"),
          message: message || "Saved changes",
          changedAt: nowIso(),
          changedBy: CURRENT_USER.name,
          snapshot: deepClone(object)
        });
        state.versions[objectId] = state.versions[objectId].slice(0, 30);
      }

      function persistState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sanitizeForStorage(state)));
        } catch (error) {
          console.error(error);
          pushToast("Local save space is full. Recent changes are still in this session.", "warn");
        }
      }

      function updateQuickbaseScopeField(field, value) {
        const previousScope = quickbaseScopeKey(state.system.quickbase);
        persistScopedQuickbaseStorageConfig(state.system.quickbase);
        state.system.quickbase[field] = value;
        const nextScope = quickbaseScopeKey(state.system.quickbase);
        if (previousScope !== nextScope && !restoreScopedQuickbaseStorageConfig(state.system.quickbase, { replace: true })) {
          resetQuickbaseStorageConfig(state.system.quickbase);
        }
        persistState();
        render();
      }

      function updateQuickbaseStorageField(field, value) {
        state.system.quickbase.storage[field] = value;
        persistScopedQuickbaseStorageConfig(state.system.quickbase);
        markPendingSync("Quickbase storage settings changed.");
        persistState();
      }

      function createDraftFilter(tableId, fieldId = "") {
        const table = resolveTable(tableId);
        const field = fieldId
          ? resolveField(tableId, fieldId)
          : table?.fields?.[0] || null;
        if (!field) return null;
        return {
          id: uid("draft_filter"),
          fieldId: field.id,
          operator: fieldOptionsForType(field)[0]?.value || "equals",
          value: ""
        };
      }

      function createDraftSort(tableId, fieldId = "") {
        const table = resolveTable(tableId);
        const field = fieldId
          ? resolveField(tableId, fieldId)
          : table?.fields?.[0] || null;
        if (!field) return null;
        return {
          id: uid("draft_sort"),
          fieldId: field.id,
          direction: "asc"
        };
      }

      function normalizeDraftFiltersAndSorts(draft, tableId) {
        const table = resolveTable(tableId);
        const fields = table?.fields || [];
        const fieldIds = new Set(fields.map(field => field.id));
        draft.filters = (draft.filters || [])
          .filter(filter => fieldIds.has(filter.fieldId))
          .map(filter => {
            const field = resolveField(tableId, filter.fieldId);
            const options = fieldOptionsForType(field);
            const operator = options.some(option => option.value === filter.operator)
              ? filter.operator
              : (options[0]?.value || "equals");
            return Object.assign({}, filter, { operator });
          });
        draft.sorts = (draft.sorts || [])
          .filter(sort => fieldIds.has(sort.fieldId))
          .map(sort => Object.assign({}, sort, {
            direction: sort.direction === "desc" ? "desc" : "asc"
          }));
      }

      function applyDraftQueryToReport(report, draft) {
        report.filters = deepClone(draft.filters || []);
        report.sorts = deepClone(draft.sorts || []);
      }

      function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return initializeStateShape(createSeedState());
        try {
          return initializeStateShape(JSON.parse(raw));
        } catch (error) {
          console.error(error);
          return initializeStateShape(createSeedState());
        }
      }

      async function probeProvider() {
        if (state.system.providerMode !== "quickbase") {
          setSyncState("local", "Browser storage is active.");
          persistState();
          render();
          pushToast("Browser storage is active.", "ok");
          return;
        }
        if (!quickbaseConfigured()) {
          pushToast("Add the realm, app ID, and user token first.", "warn");
          return;
        }
        setSyncState("running", "Testing Quickbase connection");
        render();
        try {
          const response = usingDirectQuickbaseApi()
            ? await quickbaseFetchAppInfo()
            : await quickbaseRequest(state.system.quickbase.bootstrapPath, {
                mode: "probe",
                sentAt: nowIso(),
                currentUser: CURRENT_USER
              });
          state.system.pendingSync = false;
          state.system.pendingReason = "";
          setSyncState("ok", response?.message || "Quickbase data connection is ready.", nowIso());
          persistState();
          render();
          pushToast("Quickbase data connection is ready.", "ok");
        } catch (error) {
          console.error(error);
          setSyncState("error", error.message || "Quickbase connection failed.");
          persistState();
          render();
          pushToast(error.message || "Quickbase connection failed.", "danger");
        }
      }

      async function connectAndLoadQuickbase() {
        await probeProvider();
        if (state.system.syncStatus === "ok") {
          await pullProviderState({ silent: true });
        }
      }

      async function pullProviderState(options = {}) {
        if (state.system.providerMode !== "quickbase") {
          pushToast("Switch to Quickbase sync first.", "warn");
          return;
        }
        if (!quickbaseConfigured()) {
          pushToast("Add the realm, app ID, and user token first.", "warn");
          return;
        }
        const { silent = false } = options;
        setSyncState("running", "Loading latest shared data");
        if (!silent) render();
        try {
          if (usingDirectQuickbaseApi()) {
            if (hasDirectQuickbaseSettingsStorage()) {
              const remoteStorageConfig = await loadDirectQuickbaseStorageConfigRecord();
              if (remoteStorageConfig) {
                state.system.quickbase.storage = Object.assign({}, defaultSystemState().quickbase.storage, state.system.quickbase.storage, remoteStorageConfig);
                persistScopedQuickbaseStorageConfig(state.system.quickbase);
              }
            }
            await refreshMetadataFromProvider({ silent: true });
            maybeAutoConfigureQuickbaseStorage({ silent: true });
            if (hasDirectQuickbaseObjectStorage()) {
              const bundle = await loadDirectQuickbaseStorageBundle();
              const loadedRemote = applyDirectQuickbaseStorageBundle(bundle);
              if (!loadedRemote && !silent) {
                pushToast("No saved studio items were found in the configured Quickbase storage tables.", "warn");
              }
            }
          } else {
            const response = await quickbaseRequest(state.system.quickbase.bootstrapPath, {
              mode: "bootstrap",
              sentAt: nowIso(),
              currentUser: CURRENT_USER
            });
            applyRemoteBundle(response.bundle || response);
          }
          state.system.pendingSync = false;
          state.system.pendingReason = "";
          setSyncState("ok", usingDirectQuickbaseApi() ? "Studio objects, tables, and fields loaded. Preview data continues in the background." : "Latest shared data loaded.", nowIso());
          persistState();
          render();
          if (usingDirectQuickbaseApi()) {
            scheduleObjectDataRefresh(getActiveObject());
          }
          if (!silent) pushToast("Latest shared data loaded.", "ok");
        } catch (error) {
          console.error(error);
          setSyncState("error", error.message || "Unable to load shared data.");
          persistState();
          render();
          if (!silent) pushToast(error.message || "Unable to load shared data.", "danger");
        }
      }

      async function syncStateToProvider(scope) {
        if (state.system.providerMode !== "quickbase") {
          setSyncState("local", "Changes are stored in this browser.");
          persistState();
          render();
          return;
        }
        if (!quickbaseConfigured()) {
          pushToast("Add the realm, app ID, and user token first.", "warn");
          return;
        }
        if (usingDirectQuickbaseApi()) {
          const settingsOnly = scope === "provider-settings";
          await ensureDirectQuickbaseStorageConfigured({ silent: true });
          if (!hasDirectQuickbaseObjectStorage() && !hasDirectQuickbaseSettingsStorage() && !hasDirectQuickbaseVersionStorage()) {
            pushToast("No compatible Quickbase storage tables were detected. Open Data and sync to review the auto-detected DBIDs and FIDs.", "warn");
            return;
          }
          if (settingsOnly && !hasDirectQuickbaseSettingsStorage()) {
            pushToast("Add the user settings table mapping before saving Quickbase sync settings.", "warn");
            return;
          }
          setSyncState("running", settingsOnly ? "Saving Quickbase sync settings" : "Saving to Quickbase tables");
          render();
          try {
            persistScopedQuickbaseStorageConfig(state.system.quickbase);
            if (settingsOnly) {
              const savedStorageConfig = await syncDirectQuickbaseStorageConfigRecord();
              if (state.system.pendingReason === "Quickbase storage settings changed.") {
                state.system.pendingSync = false;
                state.system.pendingReason = "";
              }
              setSyncState("ok", savedStorageConfig ? "Quickbase sync settings saved." : "No Quickbase sync settings were written.", nowIso());
              persistState();
              render();
              pushToast(savedStorageConfig ? "Quickbase sync settings saved." : "No Quickbase sync settings were written.", savedStorageConfig ? "ok" : "warn");
              return;
            }
            const objectRecordIds = hasDirectQuickbaseObjectStorage() ? await syncDirectQuickbaseObjectRecords() : {};
            const savedObjectCount = hasDirectQuickbaseObjectStorage() ? Object.keys(objectRecordIds).length : 0;
            const [savedStorageConfig, savedSettings, savedVersions] = await Promise.all([
              syncDirectQuickbaseStorageConfigRecord(),
              syncDirectQuickbasePreferenceRecords(objectRecordIds),
              syncDirectQuickbaseVersionRecords(objectRecordIds)
            ]);
            state.system.pendingSync = false;
            state.system.pendingReason = "";
            setSyncState("ok", "Saved directly to Quickbase tables.", nowIso());
            persistState();
            render();
            const notes = [];
            if (!hasDirectQuickbaseObjectStorage()) notes.push("studio items table skipped");
            else notes.push(savedObjectCount + " studio items");
            if (savedStorageConfig) notes.push("storage config saved");
            else if (!hasDirectQuickbaseSettingsStorage()) notes.push("storage config skipped");
            if (!hasDirectQuickbaseSettingsStorage()) notes.push("user settings table skipped");
            else if (savedSettings) notes.push(savedSettings + " settings rows");
            if (!hasDirectQuickbaseVersionStorage()) notes.push("version table skipped");
            else if (savedVersions) notes.push(savedVersions + " version rows");
            pushToast(notes.length ? ("Saved to Quickbase. " + notes.join(" · ")) : "Saved directly to Quickbase.", "ok");
          } catch (error) {
            console.error(error);
            setSyncState("error", error.message || "Direct Quickbase save failed.");
            persistState();
            render();
            pushToast(error.message || "Direct Quickbase save failed.", "danger");
          }
          return;
        }
        setSyncState("running", "Saving to Quickbase");
        render();
        try {
          const response = await quickbaseRequest(state.system.quickbase.savePath, buildProviderPayload(scope));
          state.system.pendingSync = false;
          state.system.pendingReason = "";
          setSyncState("ok", response?.message || "Saved to Quickbase.", response?.syncedAt || nowIso());
          persistState();
          render();
          pushToast(response?.message || "Saved to Quickbase.", "ok");
        } catch (error) {
          console.error(error);
          setSyncState("error", error.message || "Quickbase save failed.");
          persistState();
          render();
          pushToast(error.message || "Quickbase save failed.", "danger");
        }
      }

      function syncStateToProviderIfQuickbase(scope) {
        if (state.system.providerMode === "quickbase") {
          syncStateToProvider(scope);
        }
      }

      async function refreshMetadataFromProvider(options = {}) {
        if (state.system.providerMode !== "quickbase") {
          state.system.lastMetadataRefreshAt = nowIso();
          persistState();
          render();
          pushToast("Local metadata is already active.", "ok");
          return;
        }
        if (!quickbaseConfigured()) {
          pushToast("Add the realm, app ID, and user token first.", "warn");
          return;
        }
        const { silent = false } = options;
        setSyncState("running", "Refreshing metadata");
        if (!silent) render();
        try {
          if (usingDirectQuickbaseApi()) {
            const remote = await loadQuickbaseMetadata();
            state.metadata = { tables: remote.tables, app: remote.app };
            resetPreviewDataCache();
            maybeAutoConfigureQuickbaseStorage({ silent: true });
          } else {
            const response = await quickbaseRequest(state.system.quickbase.metadataPath, {
              mode: "metadata",
              sentAt: nowIso(),
              currentUser: CURRENT_USER
            });
            if (response.metadata) state.metadata = deepClone(response.metadata);
            if (response.data) state.data = deepClone(response.data);
          }
          state.sessions.resultCache = {};
          state.system.lastMetadataRefreshAt = nowIso();
          setSyncState("ok", usingDirectQuickbaseApi() ? "Quickbase tables and fields refreshed." : "Metadata refreshed.", nowIso());
          persistState();
          render();
          if (!silent) pushToast(usingDirectQuickbaseApi() ? "Quickbase tables and fields refreshed." : "Metadata refreshed.", "ok");
        } catch (error) {
          console.error(error);
          setSyncState("error", error.message || "Metadata refresh failed.");
          persistState();
          render();
          if (!silent) pushToast(error.message || "Metadata refresh failed.", "danger");
        }
      }

      async function tryRemoteExport(job, dashboard) {
        if (state.system.providerMode !== "quickbase") return false;
        if (usingDirectQuickbaseApi()) return false;
        if (!state.system.quickbase.useRemoteExport) return false;
        if (!quickbaseConfigured()) return false;
        const payload = {
          mode: "export",
          sentAt: nowIso(),
          currentUser: CURRENT_USER,
          dashboard: deepClone(dashboard),
          reports: dashboard.tabs.flatMap(tab => tab.widgets.map(widget => resolveWidgetReport(widget))).filter(Boolean),
          runtimeFilters: dashboard.runtimeFilters.map(filter => ({
            id: filter.id,
            value: getPreferenceBucket(dashboard.id).runtimeFilters[filter.id] ?? filter.defaultValue ?? ""
          }))
        };
        try {
          job.message = "Starting Quickbase export job";
          render();
          const response = await quickbaseRequest(state.system.quickbase.exportPath, payload);
          if (response.downloadUrl) {
            window.open(response.downloadUrl, "_blank", "noopener,noreferrer");
            job.status = "done";
            job.message = response?.message || "Quickbase export started.";
            job.finishedAt = nowIso();
            render();
            persistState();
            return true;
          }
          if (response.jobId || response.statusUrl || response.queued) {
            job.status = "done";
            job.message = response?.message || "Quickbase export job accepted.";
            job.finishedAt = nowIso();
            render();
            persistState();
            return true;
          }
          if (response.message) {
            job.message = response.message;
            render();
          }
        } catch (error) {
          console.error(error);
          job.message = "Remote export unavailable. Falling back to browser export.";
          render();
        }
        return false;
      }

      function favoriteSet(object) {
        return new Set(object.favoriteBy || []);
      }

      function isFavorite(object) {
        return favoriteSet(object).has(CURRENT_USER.id);
      }

      function toggleFavorite(objectId) {
        commitMutation("Updated favorite", () => {
          const object = state.catalog.objects[objectId];
          if (!object.favoriteBy) object.favoriteBy = [];
          const set = favoriteSet(object);
          if (set.has(CURRENT_USER.id)) {
            object.favoriteBy = object.favoriteBy.filter(item => item !== CURRENT_USER.id);
          } else {
            object.favoriteBy.push(CURRENT_USER.id);
          }
        }, { recordHistory: false });
      }

      function getActiveObject() {
        return state.catalog.objects[state.ui.activeObjectId] || null;
      }

      function getPreferenceBucket(objectId) {
        if (!state.preferences[objectId]) state.preferences[objectId] = {};
        if (!state.preferences[objectId][CURRENT_USER.id]) {
          state.preferences[objectId][CURRENT_USER.id] = {
            rememberRuntimeFilters: true,
            runtimeFilters: {},
            preferredTabId: "",
            openLastTab: true,
            preferredView: "builder"
          };
        }
        return state.preferences[objectId][CURRENT_USER.id];
      }

      function applyActiveObjectSelection(objectId) {
        const nextObjectId = objectId && state.catalog.objects[objectId]
          ? objectId
          : (state.catalog.order[0] || null);
        state.ui.activeObjectId = nextObjectId;
        state.ui.selectedWidgetId = null;
        state.ui.fieldSearch = "";
        const object = getActiveObject();
        if (object && object.type === "dashboard") {
          const prefs = getPreferenceBucket(object.id);
          if (!prefs.rememberRuntimeFilters) {
            const reset = {};
            object.runtimeFilters.forEach(filter => {
              reset[filter.id] = filter.defaultValue || "";
            });
            prefs.runtimeFilters = reset;
          }
          state.ui.selectedTabId = prefs.openLastTab && prefs.preferredTabId
            ? prefs.preferredTabId
            : object.tabs[0]?.id || null;
          scheduleActiveObjectLoading();
        } else {
          state.ui.selectedTabId = null;
        }
        if (nextObjectId) {
          state.catalog.recent = [nextObjectId].concat(state.catalog.recent.filter(id => id !== nextObjectId)).slice(0, 12);
        }
        return object;
      }

      function setActiveObject(objectId) {
        const object = applyActiveObjectSelection(objectId);
        persistState();
        render();
        scheduleObjectDataRefresh(object);
      }

      function applyRouteStateFromLocation() {
        const route = parseHostedObjectRoute();
        const routeContext = getHostedRouteContext();
        if (routeContext.forcedViewer) {
          state.ui.mode = "viewer";
        } else if (routeContext.mode === "builder") {
          state.ui.mode = "builder";
        }
        if (route?.id && state.catalog.objects[route.id]) {
          applyActiveObjectSelection(route.id);
        } else if (!state.ui.activeObjectId || !state.catalog.objects[state.ui.activeObjectId]) {
          applyActiveObjectSelection(state.catalog.order[0] || null);
        }
        syncDocumentTitle();
      }

      function handleHashChange() {
        syncingRouteFromLocation = true;
        try {
          applyRouteStateFromLocation();
          persistState();
          render();
          scheduleObjectDataRefresh(getActiveObject());
        } finally {
          syncingRouteFromLocation = false;
        }
      }

      function hasPermission(object, action) {
        if (!object) return false;
        if (object.ownerId === CURRENT_USER.id) return true;
        const permissions = object.permissions || {};
        const editors = permissions.editors || [];
        const viewers = permissions.viewers || [];
        const exporters = permissions.exporters || [];
        if (action === "view") return viewers.includes("*") || viewers.includes(CURRENT_USER.id) || editors.includes(CURRENT_USER.id);
        if (action === "edit") return editors.includes(CURRENT_USER.id);
        if (action === "export") return exporters.includes("*") || exporters.includes(CURRENT_USER.id) || editors.includes(CURRENT_USER.id);
        return false;
      }

      function activeDashboardTab(dashboard) {
        const tab = dashboard.tabs.find(item => item.id === state.ui.selectedTabId);
        return tab || dashboard.tabs[0] || null;
      }

      function activeWidget(dashboard) {
        const tab = activeDashboardTab(dashboard);
        if (!tab) return null;
        return tab.widgets.find(widget => widget.id === state.ui.selectedWidgetId) || tab.widgets[0] || null;
      }

      function resolveField(tableId, fieldId) {
        const table = state.metadata.tables.find(item => item.id === tableId);
        if (!table) return null;
        return table.fields.find(field => field.id === fieldId) || null;
      }

      function resolveTable(tableId) {
        return state.metadata.tables.find(item => item.id === tableId) || null;
      }

      function resolveWidgetReport(widget) {
        if (!widget) return null;
        if (widget.reportRef.mode === "copied") return widget.reportRef.snapshot || null;
        return state.catalog.objects[widget.reportRef.reportId] || null;
      }

      function getValidation(object) {
        const errors = [];
        const warnings = [];
        if (!object) return { errors, warnings };
        if (!object.name?.trim()) errors.push("Name is required.");
        if (object.type === "report") {
          ensureReportViewConfig(object);
          const table = resolveTable(object.source.tableId);
          if (!table) {
            errors.push("Data source is missing.");
          } else {
            if (!object.selectedFields.length) errors.push("Pick at least one field.");
            object.selectedFields.forEach(entry => {
              if (!resolveField(object.source.tableId, entry.fieldId)) {
                warnings.push("A selected field no longer exists.");
              }
            });
            object.filters.forEach(filter => {
              const field = resolveField(object.source.tableId, filter.fieldId);
              if (!field) warnings.push("A filter field no longer exists.");
              if (!filter.operator) errors.push("A filter is missing its rule.");
            });
            object.groups.forEach(group => {
              if (!resolveField(object.source.tableId, group.fieldId)) warnings.push("A group field no longer exists.");
            });
            object.sorts.forEach(sort => {
              if (!resolveField(object.source.tableId, sort.fieldId)) warnings.push("A sort field no longer exists.");
            });
            if (object.view.mode === "chart" && !object.view.chartFieldId) errors.push("Pick a chart field.");
            if (object.view.mode === "timeline" && !object.view.timelineDateField) errors.push("Pick a start date field for the timeline.");
            if (object.view.mode === "calendar" && !object.view.calendarDateField) errors.push("Pick a date field for the calendar.");
            if (object.view.mode === "kanban" && !object.view.kanbanField) errors.push("Pick a board field for the kanban view.");
            if (["timeline", "calendar", "kanban"].includes(object.view.mode) && !object.view.titleFieldId) {
              warnings.push("Pick a title field to improve card labels.");
            }
          }
        }
        if (object.type === "dashboard") {
          if (!object.tabs.length) errors.push("Add at least one tab.");
          object.tabs.forEach(tab => {
            if (!tab.name?.trim()) errors.push("Every tab needs a name.");
            tab.widgets.forEach(widget => {
              const report = resolveWidgetReport(widget);
              if (!report) warnings.push("A widget has a missing report.");
            });
          });
        }
        return { errors, warnings };
      }

      function saveActiveObject(mode = "save") {
        const object = getActiveObject();
        if (!object) return;
        const validation = getValidation(object);
        if (validation.errors.length) {
          pushToast(validation.errors[0], "danger");
          return;
        }
        commitMutation("Saved", () => {
          const current = state.catalog.objects[object.id];
          current.updatedAt = nowIso();
          current.changedBy = CURRENT_USER.name;
          if (mode === "saveAs") {
            const copy = cloneObject(current);
            copy.id = uid(current.type);
            copy.name = current.name + " Copy";
            copy.createdAt = nowIso();
            copy.updatedAt = nowIso();
            copy.changedBy = CURRENT_USER.name;
            state.catalog.objects[copy.id] = copy;
            state.catalog.order.unshift(copy.id);
            if (copy.type === "dashboard") {
              state.preferences[copy.id] = deepClone(getPreferenceBucket(object.id));
              state.ui.activeObjectId = copy.id;
              state.ui.selectedTabId = copy.tabs[0]?.id || null;
            } else {
              state.ui.activeObjectId = copy.id;
            }
          }
        }, { versionObjectId: object.id });
        pushToast(mode === "saveAs" ? "Saved as a new item." : "Changes saved.", "ok");
        syncStateToProviderIfQuickbase(mode === "saveAs" ? "saveAs" : "save");
      }

      function cloneObject(object) {
        const clone = deepClone(object);
        if (clone.type === "dashboard") {
          clone.tabs = clone.tabs.map(tab => ({
            ...tab,
            id: uid("tab"),
            widgets: tab.widgets.map(widget => ({
              ...widget,
              id: uid("widget")
            }))
          }));
        }
        return clone;
      }

      function duplicateActiveObject() {
        const object = getActiveObject();
        if (!object) return;
        commitMutation("Duplicated object", () => {
          const copy = cloneObject(object);
          copy.id = uid(object.type);
          copy.name = object.name + " Copy";
          copy.createdAt = nowIso();
          copy.updatedAt = nowIso();
          copy.changedBy = CURRENT_USER.name;
          state.catalog.objects[copy.id] = copy;
          state.catalog.order.unshift(copy.id);
          state.ui.activeObjectId = copy.id;
          state.ui.selectedTabId = copy.type === "dashboard" ? copy.tabs[0]?.id || null : null;
        });
        pushToast("Duplicate ready.", "ok");
        syncStateToProviderIfQuickbase("duplicate");
      }

      function restoreVersion(objectId, versionId) {
        const version = (state.versions[objectId] || []).find(item => item.id === versionId);
        if (!version) return;
        commitMutation("Restored version", () => {
          const snapshot = cloneObject(version.snapshot);
          snapshot.id = objectId;
          snapshot.updatedAt = nowIso();
          snapshot.changedBy = CURRENT_USER.name;
          state.catalog.objects[objectId] = snapshot;
          if (snapshot.type === "dashboard") {
            state.ui.selectedTabId = snapshot.tabs[0]?.id || null;
          }
        }, { versionObjectId: objectId });
        pushToast("Version restored.", "ok");
      }

      function reorderItems(list, sourceId, targetId) {
        const sourceIndex = list.findIndex(item => item.id === sourceId);
        const targetIndex = list.findIndex(item => item.id === targetId);
        if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return list;
        const updated = list.slice();
        const [item] = updated.splice(sourceIndex, 1);
        updated.splice(targetIndex, 0, item);
        return updated;
      }

      function updateObjectMeta(field, value) {
        const object = getActiveObject();
        if (!object) return;
        commitMutation("Updated details", () => {
          const target = state.catalog.objects[object.id];
          target[field] = value;
          target.updatedAt = nowIso();
          target.changedBy = CURRENT_USER.name;
        });
      }

      function fieldOptionsForType(field) {
        if (!field) return [];
        switch (field.type) {
          case "text":
          case "lookup":
          case "formula-text":
            return [
              { value: "contains", label: "contains" },
              { value: "notContains", label: "does not contain" },
              { value: "equals", label: "is" },
              { value: "notEquals", label: "is not" },
              { value: "blank", label: "is blank" },
              { value: "notBlank", label: "is not blank" }
            ];
          case "number":
          case "currency":
          case "summary":
          case "formula-number":
            return [
              { value: "equals", label: "is" },
              { value: "notEquals", label: "is not" },
              { value: "gt", label: "is above" },
              { value: "lt", label: "is below" },
              { value: "blank", label: "is blank" },
              { value: "notBlank", label: "is not blank" }
            ];
          case "date":
          case "datetime":
            return [
              { value: "on", label: "is on" },
              { value: "notOn", label: "is not on" },
              { value: "after", label: "is after" },
              { value: "before", label: "is before" },
              { value: "preset", label: "uses preset" },
              { value: "blank", label: "is blank" },
              { value: "notBlank", label: "is not blank" }
            ];
          case "user":
            return [
              { value: "equals", label: "is" },
              { value: "notEquals", label: "is not" },
              { value: "anyof", label: "is any of" },
              { value: "noneof", label: "is none of" },
              { value: "blank", label: "is blank" },
              { value: "notBlank", label: "is not blank" }
            ];
          case "multiselect":
            return [
              { value: "includes", label: "includes" },
              { value: "notIncludes", label: "does not include" },
              { value: "equals", label: "matches" },
              { value: "notEquals", label: "does not match" },
              { value: "blank", label: "is blank" },
              { value: "notBlank", label: "is not blank" }
            ];
          default:
            return [
              { value: "equals", label: "is" },
              { value: "notEquals", label: "is not" },
              { value: "blank", label: "is blank" },
              { value: "notBlank", label: "is not blank" }
            ];
        }
      }

      function aggregateOptions(field) {
        const base = [{ value: "count", label: "Count" }, { value: "countNonBlank", label: "Count non-blank" }];
        if (!field) return base;
        if (["number", "currency", "summary", "formula-number"].includes(field.type)) {
          return base.concat([
            { value: "sum", label: "Sum" },
            { value: "avg", label: "Average" },
            { value: "min", label: "Min" },
            { value: "max", label: "Max" }
          ]);
        }
        return base.concat([{ value: "distinct", label: "Distinct count" }]);
      }

      function coerceDate(value) {
        if (!value) return null;
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function isBlankFilterValue(value) {
        return value === null
          || value === undefined
          || value === ""
          || (Array.isArray(value) && !value.length);
      }

      function resolveDynamicFilterValue(raw) {
        if (!raw || typeof raw !== "string") return raw;
        const now = new Date();
        if (raw === "CURRENT_MONTH") {
          return {
            start: new Date(now.getFullYear(), now.getMonth(), 1),
            end: new Date(now.getFullYear(), now.getMonth() + 1, 0)
          };
        }
        if (raw === "LAST_30_DAYS") {
          const start = new Date(now);
          start.setDate(start.getDate() - 30);
          return { start, end: now };
        }
        if (raw === "CURRENT_YEAR") {
          return {
            start: new Date(now.getFullYear(), 0, 1),
            end: new Date(now.getFullYear(), 11, 31)
          };
        }
        return raw;
      }

      function matchFilter(rowValue, field, filter) {
        if (filter.operator === "blank") return isBlankFilterValue(rowValue);
        if (filter.operator === "notBlank") return !isBlankFilterValue(rowValue);
        const value = resolveDynamicFilterValue(filter.value);
        if (field.type === "multiselect") {
          const items = Array.isArray(rowValue) ? rowValue : String(rowValue || "").split(";").filter(Boolean);
          if (filter.operator === "includes") return items.includes(String(value));
          if (filter.operator === "notIncludes") return !items.includes(String(value));
          if (filter.operator === "equals") return items.join(";") === String(value);
          if (filter.operator === "notEquals") return items.join(";") !== String(value);
          return true;
        }
        if (field.type === "date" || field.type === "datetime") {
          const left = coerceDate(rowValue);
          if (!left) return false;
          if (filter.operator === "preset" && value && value.start && value.end) {
            return left >= value.start && left <= value.end;
          }
          const right = coerceDate(value);
          if (!right) return true;
          if (filter.operator === "on") return left.toDateString() === right.toDateString();
          if (filter.operator === "notOn") return left.toDateString() !== right.toDateString();
          if (filter.operator === "after") return left > right;
          if (filter.operator === "before") return left < right;
        }
        if (["number", "currency", "summary", "formula-number"].includes(field.type)) {
          const left = Number(rowValue ?? 0);
          const right = Number(value ?? 0);
          if (filter.operator === "equals") return left === right;
          if (filter.operator === "notEquals") return left !== right;
          if (filter.operator === "gt") return left > right;
          if (filter.operator === "lt") return left < right;
          return true;
        }
        if (field.type === "user" && (filter.operator === "anyof" || filter.operator === "noneof")) {
          const selectedUsers = String(value).split(",").map(item => item.trim()).filter(Boolean);
          const includesUser = selectedUsers.includes(String(rowValue || ""));
          return filter.operator === "anyof" ? includesUser : !includesUser;
        }
        if (filter.operator === "contains") return String(rowValue || "").toLowerCase().includes(String(value || "").toLowerCase());
        if (filter.operator === "notContains") return !String(rowValue || "").toLowerCase().includes(String(value || "").toLowerCase());
        if (filter.operator === "notEquals") return String(rowValue || "") !== String(value || "");
        return String(rowValue || "") === String(value || "");
      }

      function formatCellValue(field, value) {
        if (value === null || value === undefined || value === "") return "";
        if (!field) return String(value);
        if (field.type === "currency") return new Intl.NumberFormat(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(Number(value || 0));
        if (field.type === "number" || field.type === "summary" || field.type === "formula-number") return new Intl.NumberFormat().format(Number(value || 0));
        if (field.type === "date") return fmtDate(value);
        if (field.type === "datetime") return fmtDateTime(value);
        if (field.type === "multiselect") return Array.isArray(value) ? value.join(", ") : String(value);
        return String(value);
      }

      function summarizeRows(rows, report, fieldMap) {
        const metrics = (report.summary?.metrics || []).slice(0, 4);
        if (!metrics.length) {
          return [{ label: "Rows", value: rows.length }];
        }
        return metrics.map(metric => {
          const field = fieldMap[metric.fieldId];
          const values = rows.map(row => row[metric.fieldId]).filter(value => value !== null && value !== undefined && value !== "");
          let value = 0;
          if (metric.op === "count") value = rows.length;
          if (metric.op === "countNonBlank") value = values.length;
          if (metric.op === "distinct") value = new Set(values.map(item => JSON.stringify(item))).size;
          if (metric.op === "sum") value = values.reduce((sum, item) => sum + Number(item || 0), 0);
          if (metric.op === "avg") value = values.length ? values.reduce((sum, item) => sum + Number(item || 0), 0) / values.length : 0;
          if (metric.op === "min") value = values.length ? Math.min(...values.map(item => Number(item || 0))) : 0;
          if (metric.op === "max") value = values.length ? Math.max(...values.map(item => Number(item || 0))) : 0;
          return {
            label: metric.label || (field ? field.label : "Metric"),
            value: ["sum", "avg", "min", "max"].includes(metric.op) && field ? formatCellValue(field, value) : value
          };
        });
      }

      function chartDataForRows(rows, report, fieldMap) {
        ensureReportViewConfig(report);
        const labelField = fieldMap[report.view.chartFieldId || report.chart?.labelField];
        if (!labelField) return [];
        const counts = new Map();
        rows.forEach(row => {
          const label = row[labelField.id];
          const key = Array.isArray(label) ? label.join(", ") : String(label || "Blank");
          counts.set(key, (counts.get(key) || 0) + 1);
        });
        return Array.from(counts.entries())
          .map(([label, value], index) => ({ label, value, color: COLORS[index % COLORS.length] }))
          .sort((left, right) => right.value - left.value);
      }
